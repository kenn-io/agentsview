name: Sibling pins on main

# A pull request may pin a sibling kenn-io repository's pull request build
# while both are open, but it may not merge until every pin is on that
# sibling's main. See https://github.com/kenn-io/actions/tree/main/sibling-pins.
#
# pull_request_target takes this workflow, and so the action's pinned commit,
# from the target branch. The action reads only the candidate's dependency
# files. A repository ruleset requires this job, including in merge groups.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  sibling-pins:
    name: Sibling pins on main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check sibling pins
        uses: kenn-io/actions/sibling-pins@05b0c9f972e33ff5ea3cfbd2cd66e74e4f9895f9
