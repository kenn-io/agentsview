name: Sibling pins on main

# A pull request may pin a sibling kenn-io repository's pull request build
# while both are open, but it may not merge until every pin is on that
# sibling's main. See https://github.com/kenn-io/actions/tree/main/sibling-pins.
#
# Use the same permissions as normal pull request CI, including for forks.
# The action reads only the candidate's dependency files.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  sibling-pins:
    name: Sibling pins on main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check sibling pins
        uses: kenn-io/actions/sibling-pins@68ba2c6390aff0de4aced81a8c2af669514c7ac0
