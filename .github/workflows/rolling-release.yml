name: Rolling Release

# Build directly-usable Linux and Windows binaries on every push to main.
# A manual run (workflow_dispatch) builds the current tip of main, for when a
# push did not start a run. Manual runs on other branches fail before building.
#
# Each build is published as a permanent snapshot prerelease tagged
# "build-YYYYMMDD-<sha8>", where the date is the commit's committer date in
# UTC, so re-runs of a commit reuse its tag. A complete snapshot is never
# modified. The rolling "latest" prerelease is then updated in place with
# byte-identical copies of the snapshot's assets plus the installers.
#
# Assets on both releases:
#   agentsview-linux-amd64, agentsview-windows-amd64.exe, SHA256SUMS
#   VERSION    the exact string both binaries embed as main.version
#   BUILD_TAG  the snapshot tag name
# "latest" also carries install.sh and install.ps1.
#
# New clients read latest/BUILD_TAG once and fetch everything else from that
# snapshot. Older clients read latest/VERSION, latest/SHA256SUMS, and
# latest/<binary>.
#
# Job graph: metadata -> build-linux + build-windows -> snapshot -> latest

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# There is deliberately no workflow-level concurrency group. Every push to
# main must build and get its own snapshot, even when newer pushes follow
# quickly, so superseded runs are not cancelled. This spends more CI minutes
# than cancelling them did. Only the update of "latest" is serialized; see
# the latest job.

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      build_tag: ${{ steps.meta.outputs.build_tag }}
      build_date: ${{ steps.meta.outputs.build_date }}
      subject: ${{ steps.meta.outputs.subject }}
    steps:
      # A manual run can target any branch, and the latest job publishes a
      # commit that diverged from latest, so only main may build.
      - name: Require main
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "Rolling builds publish only from main, not $GITHUB_REF." >&2
            exit 1
          fi

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          # git describe needs the full history and tags.
          fetch-depth: 0
          persist-credentials: false

      # Computed once here so both binaries embed the same version and the
      # VERSION asset matches them exactly. A Windows binary that embedded a
      # different string would see an update on every check.
      - name: Compute version and snapshot tag
        id: meta
        run: |
          # Match only v* tags; the rolling "latest" and "build-*" tags
          # would otherwise become the version base.
          VERSION=$(git describe --tags --always --match 'v*')
          # Name the snapshot after the commit's committer date, not the run
          # date, so re-runs of this commit reuse the same tag.
          COMMIT_TIME=$(git show -s --format=%ct "$GITHUB_SHA")
          BUILD_TAG="build-$(date -u -d "@$COMMIT_TIME" +%Y%m%d)-${GITHUB_SHA::8}"
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          # Manual runs carry no pushed commit message, so both triggers read
          # the subject from git. A subject is always a single line.
          SUBJECT=$(git log -1 --format=%s "$GITHUB_SHA")

          if [[ ! "$VERSION" =~ ^[^[:space:]]+$ ]]; then
            echo "Unexpected version string: '$VERSION'" >&2
            exit 1
          fi
          # Clients validate BUILD_TAG with this same pattern.
          if [[ ! "$BUILD_TAG" =~ ^build-[0-9]{8}-[0-9a-f]{7,40}$ ]]; then
            echo "Unexpected snapshot tag: '$BUILD_TAG'" >&2
            exit 1
          fi

          echo "VERSION=$VERSION BUILD_TAG=$BUILD_TAG BUILD_DATE=$BUILD_DATE"
          {
            echo "version=$VERSION"
            echo "build_tag=$BUILD_TAG"
            echo "build_date=$BUILD_DATE"
            echo "subject=$SUBJECT"
          } >> "$GITHUB_OUTPUT"

  build-linux:
    needs: metadata
    runs-on: ubuntu-latest
    # manylinux_2_28 keeps the glibc requirement low so the binary runs on
    # older distributions, matching the tagged release builds.
    container: quay.io/pypa/manylinux_2_28_x86_64@sha256:853663dc8253b62be437bb52a5caecffd020792af4442f55d927d22e0ea795ae
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Trust git checkout
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git status --short >/dev/null

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "24"

      - name: Build frontend
        run: npm ci && npm run build
        working-directory: frontend

      - name: Embed frontend
        shell: bash
        run: |
          rm -rf internal/web/dist
          cp -r frontend/dist internal/web/dist

      # `make pricing-snapshot` also stages the go-sqlite3 amalgamation
      # header that the sqlite-vec cgo bindings include, which a bare
      # `go build` cannot find.
      - name: Restore pricing snapshot and stage the sqlite header
        run: make pricing-snapshot

      - name: Build
        shell: bash
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: "1"
          VERSION: ${{ needs.metadata.outputs.version }}
          BUILD_DATE: ${{ needs.metadata.outputs.build_date }}
        run: |
          # This job runs in a container, where the github.workspace
          # expression resolves to the runner host path rather than the
          # in-container mount. GITHUB_WORKSPACE is correct inside it.
          export CGO_CFLAGS="-O2 -g -I${GITHUB_WORKSPACE}/.sqlite-include"

          COMMIT=${GITHUB_SHA::8}

          mkdir -p dist
          # rollingRepo makes `agentsview update` follow this repository's
          # rolling release instead of the upstream stable releases.
          LDFLAGS="-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.buildDate=${BUILD_DATE} -X go.kenn.io/agentsview/internal/update.rollingRepo=${GITHUB_REPOSITORY}"
          go build -tags fts5 -buildvcs=false -ldflags="$LDFLAGS" -trimpath \
            -o dist/agentsview-linux-amd64 ./cmd/agentsview

          # Smoke test (native build). The binary must report exactly the
          # version the VERSION asset publishes, or `agentsview update`
          # would offer this build forever.
          EXPECTED="agentsview ${VERSION} (commit ${COMMIT}, built ${BUILD_DATE})"
          ACTUAL=$(./dist/agentsview-linux-amd64 --version)
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "ERROR: --version printed: $ACTUAL" >&2
            echo "ERROR: expected:          $EXPECTED" >&2
            exit 1
          fi
          echo "$ACTUAL"

          # Verify glibc compatibility
          MAX_GLIBC="GLIBC_2.28"
          HIGHEST=$(objdump -T dist/agentsview-linux-amd64 | grep -oP 'GLIBC_\d+\.\d+' | sort -t. -k1,1n -k2,2n | tail -1)
          echo "Highest glibc symbol: $HIGHEST (max allowed: $MAX_GLIBC)"
          if [ "$(printf '%s\n%s' "$MAX_GLIBC" "$HIGHEST" | sort -t. -k1,1n -k2,2n | tail -1)" != "$MAX_GLIBC" ]; then
            echo "ERROR: Binary requires $HIGHEST but max allowed is $MAX_GLIBC"
            exit 1
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: rolling-linux-amd64
          path: dist/agentsview-linux-amd64

  build-windows:
    needs: metadata
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "24"

      - name: Build frontend
        run: npm ci && npm run build
        working-directory: frontend

      - name: Embed frontend
        shell: bash
        run: |
          rm -rf internal/web/dist
          cp -r frontend/dist internal/web/dist

      # `make pricing-snapshot` also stages the go-sqlite3 amalgamation
      # header that the sqlite-vec cgo bindings include, which a bare
      # `go build` cannot find.
      - name: Restore pricing snapshot and stage the sqlite header
        run: make pricing-snapshot

      # MSYS2 mirrors sometimes stall mid-download. Retry once, as ci.yml
      # does, so a slow mirror does not fail the whole release.
      - name: Setup MinGW
        id: setup_mingw
        continue-on-error: true
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884  # v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc
          path-type: inherit

      - name: Setup MinGW (retry on transient failure)
        if: steps.setup_mingw.outcome == 'failure'
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884  # v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc
          path-type: inherit

      - name: Build
        shell: bash
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "1"
          CGO_CFLAGS: -O2 -g -I${{ github.workspace }}/.sqlite-include
          VERSION: ${{ needs.metadata.outputs.version }}
          BUILD_DATE: ${{ needs.metadata.outputs.build_date }}
        run: |
          COMMIT=${GITHUB_SHA::8}

          mkdir -p dist
          # rollingRepo makes `agentsview update` follow this repository's
          # rolling release instead of the upstream stable releases.
          LDFLAGS="-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.buildDate=${BUILD_DATE} -X go.kenn.io/agentsview/internal/update.rollingRepo=${GITHUB_REPOSITORY}"
          go build -tags fts5 -ldflags="$LDFLAGS" -trimpath \
            -o dist/agentsview-windows-amd64.exe ./cmd/agentsview

          # Smoke test (native build). The binary must report exactly the
          # version the VERSION asset publishes, or `agentsview update`
          # would offer this build forever.
          EXPECTED="agentsview ${VERSION} (commit ${COMMIT}, built ${BUILD_DATE})"
          ACTUAL=$(./dist/agentsview-windows-amd64.exe --version)
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "ERROR: --version printed: $ACTUAL" >&2
            echo "ERROR: expected:          $EXPECTED" >&2
            exit 1
          fi
          echo "$ACTUAL"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: rolling-windows-amd64
          path: dist/agentsview-windows-amd64.exe

  snapshot:
    needs: [metadata, build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Runs for the same commit (for example, the same commit pushed to main
    # twice) take turns, so they never race to create one snapshot. Never
    # cancel: the snapshot is the permanent record of this build.
    concurrency:
      group: rolling-release-snapshot-${{ github.sha }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_TAG: ${{ needs.metadata.outputs.build_tag }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      # The only place the VERSION and BUILD_TAG assets are written.
      - name: Write VERSION, BUILD_TAG, and checksums
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          cd artifacts
          # Older clients compare this with the running version.
          printf '%s\n' "$VERSION" > VERSION
          # Newer clients read this from "latest" to find the snapshot.
          printf '%s\n' "$BUILD_TAG" > BUILD_TAG
          sha256sum agentsview-linux-amd64 agentsview-windows-amd64.exe > SHA256SUMS
          cat SHA256SUMS

      - name: Publish snapshot release
        env:
          # Passed through the environment so the commit message cannot
          # inject shell syntax into the run script.
          COMMIT_SUBJECT: ${{ needs.metadata.outputs.subject }}
        run: |
          ASSETS=(agentsview-linux-amd64 agentsview-windows-amd64.exe SHA256SUMS VERSION BUILD_TAG)
          FILES=("${ASSETS[@]/#/artifacts/}")

          # Prints absent, incomplete (an asset is missing or not fully
          # uploaded), unpublished (a draft with every asset), or complete.
          # shellcheck disable=SC2016 # $ARGS and $have are jq variables.
          snapshot_state() {
            local json
            if ! json=$(gh release view "$BUILD_TAG" --json isDraft,assets 2>"$RUNNER_TEMP/release-view.err"); then
              if grep -q 'release not found' "$RUNNER_TEMP/release-view.err"; then
                echo absent
                return 0
              fi
              cat "$RUNNER_TEMP/release-view.err" >&2
              return 1
            fi
            jq -r '
              [.assets[] | select(.state == "uploaded") | .name] as $have
              | if (($ARGS.positional - $have) | length) > 0 then "incomplete"
                elif .isDraft then "unpublished"
                else "complete" end
            ' --args "${ASSETS[@]}" <<<"$json"
          }

          STATE=$(snapshot_state)
          echo "Snapshot $BUILD_TAG is $STATE."

          case "$STATE" in
            complete)
              # A complete snapshot is immutable. A re-run leaves it as it
              # is, and the latest job copies its assets.
              exit 0
              ;;
            absent)
              SUBJECT=$COMMIT_SUBJECT
              # shellcheck disable=SC2016 # Backticks are Markdown.
              NOTES=$(printf 'Snapshot build of `%s`.\n\n> %s\n' "$GITHUB_SHA" "$SUBJECT")
              # gh keeps the release as a draft until every asset has
              # uploaded, so the snapshot never appears half-filled.
              gh release create "$BUILD_TAG" \
                --prerelease \
                --target "$GITHUB_SHA" \
                --title "Build $BUILD_TAG" \
                --notes "$NOTES" \
                "${FILES[@]}"
              ;;
            incomplete | unpublished)
              # An earlier attempt stopped part way. Nothing points at an
              # unfinished snapshot yet, so replace every asset, not only
              # the missing ones: SHA256SUMS must describe these binaries,
              # and the binaries must embed this VERSION.
              if [ "$STATE" = incomplete ]; then
                gh release upload "$BUILD_TAG" --clobber "${FILES[@]}"
                STATE=$(snapshot_state)
              fi
              if [ "$STATE" = unpublished ]; then
                gh release edit "$BUILD_TAG" \
                  --draft=false \
                  --prerelease \
                  --target "$GITHUB_SHA"
              fi
              ;;
            *)
              echo "Unexpected snapshot state: $STATE" >&2
              exit 1
              ;;
          esac

          STATE=$(snapshot_state)
          if [ "$STATE" != complete ]; then
            echo "Snapshot $BUILD_TAG is $STATE after publishing." >&2
            exit 1
          fi

  latest:
    needs: [metadata, snapshot]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Only one update of "latest" runs at a time, and none is cancelled
    # once started. GitHub keeps at most one pending job per group and
    # cancels an older pending one when another arrives, and runs can reach
    # this job out of order, so the guard step below refuses to move
    # "latest" backwards. If an older commit's job replaces a newer one
    # while pending, "latest" stays one build behind until the next push
    # or manual run.
    concurrency:
      group: rolling-release-latest
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_TAG: ${{ needs.metadata.outputs.build_tag }}
    steps:
      - name: Check that latest is not ahead of this commit
        id: guard
        run: |
          # The commit the latest tag points at, if the tag exists.
          REF=$(gh api "repos/$GH_REPO/git/matching-refs/tags/latest" \
            --jq '.[] | select(.ref == "refs/tags/latest") | "\(.object.type) \(.object.sha)"')
          if [ -z "$REF" ]; then
            echo "No latest tag yet; publishing $GITHUB_SHA."
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TYPE=${REF%% *}
          CURRENT=${REF#* }
          # Peel an annotated tag down to the commit it marks.
          while [ "$TYPE" = tag ]; do
            REF=$(gh api "repos/$GH_REPO/git/tags/$CURRENT" --jq '"\(.object.type) \(.object.sha)"')
            TYPE=${REF%% *}
            CURRENT=${REF#* }
          done
          if [ "$TYPE" != commit ]; then
            echo "The latest tag points at a $TYPE, not a commit." >&2
            exit 1
          fi
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"

          # "behind" means this commit is an ancestor of the published one.
          # Re-runs of the same commit ("identical") and rewritten history
          # ("diverged") still publish.
          STATUS=$(gh api "repos/$GH_REPO/compare/${CURRENT}...${GITHUB_SHA}?per_page=1" --jq .status)
          echo "latest is at $CURRENT; this commit is $STATUS relative to it."
          case "$STATUS" in
            behind)
              echo "::notice::latest already holds a newer build ($CURRENT); leaving it unchanged."
              echo "publish=false" >> "$GITHUB_OUTPUT"
              ;;
            ahead | identical | diverged)
              echo "publish=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unexpected compare status: $STATUS" >&2
              exit 1
              ;;
          esac

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        if: steps.guard.outputs.publish == 'true'
        with:
          persist-credentials: false
          sparse-checkout: scripts
          path: src

      # Copy the snapshot's assets rather than this run's artifacts, so
      # "latest" stays byte-identical to the snapshot even when a re-run
      # found the snapshot already complete.
      - name: Download snapshot assets
        if: steps.guard.outputs.publish == 'true'
        run: |
          mkdir -p assets
          gh release download "$BUILD_TAG" --dir assets \
            --pattern agentsview-linux-amd64 \
            --pattern agentsview-windows-amd64.exe \
            --pattern SHA256SUMS \
            --pattern VERSION \
            --pattern BUILD_TAG
          cd assets
          sha256sum -c SHA256SUMS
          if [ "$(cat BUILD_TAG)" != "$BUILD_TAG" ]; then
            echo "Snapshot BUILD_TAG asset does not name $BUILD_TAG" >&2
            exit 1
          fi
          if [ "$(wc -l < VERSION)" -ne 1 ] || [ -z "$(cat VERSION)" ]; then
            echo "Snapshot VERSION asset is not a single line" >&2
            exit 1
          fi
          echo "VERSION: $(cat VERSION)"

      - name: Prepare installers
        if: steps.guard.outputs.publish == 'true'
        run: |
          # Point the installers at the repository that publishes this
          # release so they work straight from the release download URL.
          mkdir -p installers
          sed "s|@AGENTSVIEW_REPO@|$GH_REPO|" src/scripts/install-rolling.sh > installers/install.sh
          sed "s|@AGENTSVIEW_REPO@|$GH_REPO|" src/scripts/install-rolling.ps1 > installers/install.ps1
          if grep -l '@AGENTSVIEW_REPO@' installers/*; then
            echo "Installer placeholder was not replaced" >&2
            exit 1
          fi

      - name: Publish rolling release
        if: steps.guard.outputs.publish == 'true'
        env:
          # Passed through the environment so the commit message cannot
          # inject shell syntax into the run script.
          COMMIT_SUBJECT: ${{ needs.metadata.outputs.subject }}
          CURRENT_LATEST: ${{ steps.guard.outputs.current }}
        run: |
          SHORT_SHA=${GITHUB_SHA::8}
          SUBJECT=$COMMIT_SUBJECT
          TITLE="Rolling build ($SHORT_SHA)"

          BASE="https://github.com/$GH_REPO/releases/download/latest"
          SNAPSHOT_URL="https://github.com/$GH_REPO/releases/tag/$BUILD_TAG"
          # shellcheck disable=SC2016 # Backticks are Markdown.
          NOTES=$(
            printf 'Automated rolling build of `%s`.\n\n' "$GITHUB_SHA"
            printf '> %s\n\n' "$SUBJECT"
            printf 'The install commands and download URLs below always point at the newest build.\n\n'
            printf 'Install on Linux:\n```sh\ncurl -fsSL %s/install.sh | bash\n```\n\n' "$BASE"
            printf 'Install on Windows:\n```powershell\npowershell -ExecutionPolicy ByPass -c "irm %s/install.ps1 | iex"\n```\n\n' "$BASE"
            printf 'Download URLs:\n- %s/agentsview-linux-amd64\n- %s/agentsview-windows-amd64.exe\n\n' "$BASE" "$BASE"
            printf 'This build stays available as snapshot `%s`:\n%s\n' "$BUILD_TAG" "$SNAPSHOT_URL"
          )

          if STATE=$(gh release view latest --json isDraft \
              --jq 'if .isDraft then "draft" else "published" end' \
              2>"$RUNNER_TEMP/release-view.err"); then
            :
          elif grep -q 'release not found' "$RUNNER_TEMP/release-view.err"; then
            STATE=absent
          else
            cat "$RUNNER_TEMP/release-view.err" >&2
            exit 1
          fi
          echo "latest release is $STATE."

          # Move the existing tag first. The guard reads it, so a later job
          # for an older commit skips even if this upload fails part way.
          # Creating or publishing a release creates the tag when absent.
          if [ -n "$CURRENT_LATEST" ] && ! gh api -X PATCH "repos/$GH_REPO/git/refs/tags/latest" \
              -f sha="$GITHUB_SHA" -F force=true --silent; then
            # GITHUB_TOKEN cannot hold the workflows permission, so GitHub
            # may refuse to move a ref across commits that change
            # .github/workflows. Creating the tag through the release API
            # works for those commits, so delete the tag and let the release
            # recreate it at this commit. Download URLs may 404 for the few
            # seconds in between. If this fails part way, the next run finds
            # no tag (or a draft) and publishes normally.
            if [ "$STATE" != published ]; then
              echo "Could not move the latest tag of a $STATE release." >&2
              exit 1
            fi
            echo "::warning::Moving the latest tag failed; recreating it through the release."
            RELEASE_ID=$(gh api "repos/$GH_REPO/releases/tags/latest" --jq .id)
            gh api -X DELETE "repos/$GH_REPO/git/refs/tags/latest" --silent
            gh api -X PATCH "repos/$GH_REPO/releases/$RELEASE_ID" \
              -f tag_name=latest -f target_commitish="$GITHUB_SHA" \
              -F draft=false -F prerelease=true --silent
          fi

          if [ "$STATE" = absent ]; then
            # gh keeps the release as a draft until every asset has
            # uploaded, so it never appears without its assets.
            gh release create latest \
              --prerelease \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes "$NOTES" \
              assets/agentsview-linux-amd64 \
              assets/agentsview-windows-amd64.exe \
              installers/install.sh \
              installers/install.ps1 \
              assets/SHA256SUMS \
              assets/VERSION \
              assets/BUILD_TAG
            exit 0
          fi

          # Update the release in place so its download URLs keep working.
          # --clobber deletes each asset and then uploads its replacement,
          # so each asset is briefly missing. The order keeps clients safe:
          #   1. Binaries and installers. An older client that fetches a
          #      new binary with the old SHA256SUMS fails verification.
          #   2. SHA256SUMS, now matching the new binaries.
          #   3. VERSION. Older clients only start an update once it
          #      changes, and by then the binaries and checksums match.
          #   4. BUILD_TAG last. Newer clients keep using the previous
          #      complete snapshot until it changes.
          gh release upload latest --clobber \
            assets/agentsview-linux-amd64 \
            assets/agentsview-windows-amd64.exe \
            installers/install.sh \
            installers/install.ps1
          gh release upload latest --clobber assets/SHA256SUMS
          gh release upload latest --clobber assets/VERSION
          gh release upload latest --clobber assets/BUILD_TAG

          EDIT_ARGS=(--prerelease --title "$TITLE" --notes "$NOTES")
          if [ "$STATE" = draft ]; then
            # A draft left by an interrupted first publish. Publishing it
            # creates the tag at --target if the tag does not exist yet.
            EDIT_ARGS+=(--draft=false --target "$GITHUB_SHA")
          fi
          gh release edit latest "${EDIT_ARGS[@]}"
