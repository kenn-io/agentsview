name: CI

env:
  GOTRACEBACK: all
  # "|" falls back to direct on any proxy error (e.g. HTTP/2 INTERNAL_ERROR), not just 404/410.
  GOPROXY: "https://proxy.golang.org|direct"
  # Compile with module-relative source paths so identical source shares one
  # Go build cache across checkouts and worktrees.
  GOFLAGS: -trimpath

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
  # Run on every pull request regardless of base branch so stacked PRs that
  # target another feature branch (not just main) still get the full test,
  # lint, and e2e suite. The expensive desktop/tauri bundle builds are gated
  # to main separately in desktop-artifacts.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Timeout p99 measurements: https://github.com/kenn-io/agentsview/pull/2547
jobs:
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      groups: ${{ steps.changes.outputs.groups }}
      all: ${{ steps.changes.outputs.all }}
    steps:
      - uses: kenn-io/actions/changes@main
        id: changes
        with:
          filters: |
            go:
              - '!{frontend/**,desktop/**,*.md,docs/{README,changelog,contributing}.md,docs/agents/**/*.md,docs/internal/**/!(session-format-sources).md,docs/website/**/*.md}'
              - 'desktop/src-tauri/icons/**'
              - 'desktop/scripts/prepare-sidecar.sh'
            frontend:
              - '!{*.md,docs/*.md,docs/agents/**/*.md,docs/internal/**/*.md,docs/website/**/*.md,desktop/**}'
            node:
              - '!{cmd/**,internal/!(web)/**,testdata/**,plugins/**,support/**,*.go,*.md,docs/*.md,docs/agents/**/*.md,docs/internal/**/*.md,docs/website/**/*.md,desktop/**}'
              - 'internal/importer/claude_ai_requests.txt'
            desktop:
              - '!{cmd/**,internal/!(web)/**,testdata/**,plugins/**,support/**,*.go,*.md,docs/*.md,docs/agents/**/*.md,docs/internal/**/*.md,docs/website/**/*.md,frontend/**}'
              - 'frontend/chrome-extension/claude_fetch.js'
              - 'internal/importer/claude_ai_requests.txt'

  lint:
    env:
      DOWNLOAD_RETRY: kit-retry 3 5
    needs: changes
    if: &go-lane ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.all == 'true' || contains(fromJSON(needs.changes.outputs.groups), 'go')) }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - linter: golangci
            timeout: 19
          - linter: nilaway
            timeout: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go caches
        uses: $/.github/actions/go-cache-restore
        with:
          group: lint-${{ matrix.linter }}
          owner: "true"
          extra-path: ~/.cache/golangci-lint

      - uses: kenn-io/kit/.github/actions/kit-retry@v0.48.3

      - name: Prepare SQLite header
        if: runner.os == 'Linux'
        run: |
          make sqlite-vec-header
          echo "CGO_CFLAGS=-O2 -g -I$GITHUB_WORKSPACE/.sqlite-include" >> "$GITHUB_ENV"

      - name: Prepare SQLite header
        if: runner.os == 'Linux'
        run: |
          make sqlite-vec-header
          echo "CGO_CFLAGS=-O2 -g -I$GITHUB_WORKSPACE/.sqlite-include" >> "$GITHUB_ENV"

      - name: Prepare SQLite header
        if: runner.os == 'Linux'
        run: |
          make sqlite-vec-header
          echo "CGO_CFLAGS=-O2 -g -I$GITHUB_WORKSPACE/.sqlite-include" >> "$GITHUB_ENV"

      - name: Install lint tools
        run: |
          kit-retry 3 5 make lint-tools nilaway-golangci-build
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Fetch Go checkers
        if: matrix.linter == 'golangci'
        run: GOFLAGS="${GOFLAGS:+$GOFLAGS }-n" kit-retry 3 5 make lint-workflow-retries lint-config-check lint-sql

      - name: Run Go linters
        if: matrix.linter == 'golangci'
        run: make lint-workflow-retries lint-config-check lint-sql lint-golangci-ci

      - name: Run NilAway
        if: matrix.linter == 'nilaway'
        run: make nilaway

      - name: Check Huma API contract
        if: matrix.linter == 'golangci'
        run: |
          huma=go.kenn.io/kit/cmd/huma-check@e9840a327158da2559458186b253b0c15a5e2c2b
          kit-retry 3 5 go run -n "$huma"
          go run "$huma" -fix=false ./...

      - name: Save Go caches
        uses: $/.github/actions/go-cache-save

  frontend:
    env:
      DOWNLOAD_RETRY: kit-retry 3 5
    needs: changes
    if: &frontend-lane ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.all == 'true' || contains(fromJSON(needs.changes.outputs.groups), 'go') || contains(fromJSON(needs.changes.outputs.groups), 'frontend')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "26.12.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go caches
        uses: $/.github/actions/go-cache-restore
        with:
          group: test-${{ runner.os }}-${{ runner.arch }}

      - uses: kenn-io/kit/.github/actions/kit-retry@v0.48.3

      - name: Prepare SQLite header
        if: runner.os == 'Linux'
        run: |
          make sqlite-vec-header
          echo "CGO_CFLAGS=-O2 -g -I$GITHUB_WORKSPACE/.sqlite-include" >> "$GITHUB_ENV"

      - name: Generate pricing snapshot
        run: kit-retry 3 5 go run ./internal/pricing/cmd/litellm-snapshot

      - name: Install frontend dependencies
        run: kit-retry 3 5 npm ci
        working-directory: frontend

      - name: Format, lint, and type-check (fix formatting with npm run fmt)
        # Runs before the slower checks so formatting mistakes show up
        # first. Lint warnings do not fail this step yet; errors and
        # unformatted files do.
        run: npm run check:vp
        working-directory: frontend

      - name: Type-check (svelte-check)
        run: npm run check
        working-directory: frontend

      - name: Design-system conformance (kit-ui-check)
        # Full rule set over all of src; legitimate exceptions carry inline
        # kit-ui-check-ignore markers with reasons (e.g. the app token
        # definitions in app.css).
        run: npm run check:kit-ui
        working-directory: frontend

      - name: Run frontend tests
        run: npm test -- --retry=2 --reporter=default --reporter=github-actions --reporter=json --outputFile.json=test-results/vitest/frontend.json
        working-directory: frontend

      - name: Upload Vitest frontend report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: vitest-frontend-attempt-${{ github.run_attempt }}
          path: frontend/test-results/vitest/frontend.json
          retention-days: 14
          if-no-files-found: ignore

  frontend-node-26:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.all == 'true' || contains(fromJSON(needs.changes.outputs.groups), 'node')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "26.12.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: kenn-io/kit/.github/actions/kit-retry@v0.48.3

      - name: Install frontend dependencies
        run: kit-retry 3 5 npm ci
        working-directory: frontend

      - name: Run frontend tests
        run: npm test -- --retry=2 --reporter=default --reporter=github-actions --reporter=json --outputFile.json=test-results/vitest/frontend-node-26.json
        working-directory: frontend

      - name: Upload Vitest frontend-node-26 report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: vitest-frontend-node-26-attempt-${{ github.run_attempt }}
          path: frontend/test-results/vitest/frontend-node-26.json
          retention-days: 14
          if-no-files-found: ignore

  docs:
    name: Docs and scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DOWNLOAD_RETRY: kit-retry 3 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.15"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3

      - uses: kenn-io/kit/.github/actions/kit-retry@v0.48.3

      - name: Install docs check tools
        run: |
          sudo find /etc/apt -type f \( -name '*.list' -o -name '*.sources' \) -exec sed -i -E \
            -e 's|https?://(azure\.)?archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
            -e 's|http://security\.ubuntu\.com/ubuntu|https://security.ubuntu.com/ubuntu|g' {} +
          kit-retry 3 5 sudo apt-get -o APT::Update::Error-Mode=any update
          kit-retry 3 5 sudo apt-get install -y ripgrep

      - name: Install documentation dependencies
        run: kit-retry 3 5 uv sync --project docs --frozen

      - name: Run docs check
        run: make docs-check

      - name: Check that docs pages paint with their stylesheets and fonts
        uses: kenn-io/actions/first-paint@98e621dcda6f5d7de8590248e353e3d55c28ecf2  # main
        with:
          dist: docs/site

      - name: Collect the static app pages for the first-paint check
        run: |
          mkdir -p "$RUNNER_TEMP/app-pages"
          cp -R desktop/ui "$RUNNER_TEMP/app-pages/desktop"
          cp -R internal/web/fallback "$RUNNER_TEMP/app-pages/fallback"

      - name: Check that static app pages paint with their stylesheets and fonts
        uses: kenn-io/actions/first-paint@98e621dcda6f5d7de8590248e353e3d55c28ecf2  # main
        with:
          dist: ${{ runner.temp }}/app-pages

      - name: Run shell script tests
        run: |
          bash scripts/install_test.sh
          bash scripts/e2e-server_test.sh
          bash desktop/scripts/test-repair-appimage-diricon.sh

  test:
    needs: changes
    if: *go-lane
    name: Go ${{ matrix.testSet == 'lint' && 'Lint' || 'Test' }} (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    env:
      DOWNLOAD_RETRY: kit-retry 3 5
      MSYS2_PACKAGES: mingw-w64-x86_64-gcc ${{ matrix.testSet == 'lint' && 'make' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: ubuntu-latest, Sync
            package: ./internal/sync
            suite: linux-sync
            timeout: 29
          - os: ubuntu-latest
            name: ubuntu-latest, DuckDB
            package: ./internal/duckdb
            suite: linux-duckdb
            timeout: 28
          # The simulator compares wall times and needs the runner to itself.
          - os: ubuntu-latest
            name: ubuntu-latest, Simulator
            package: ./cmd/perfsim
            suite: linux-perfsim
            timeout: 20
          - os: ubuntu-latest
            name: ubuntu-latest, Other packages
            testSet: other
            suite: linux-other
            timeout: 32
          - os: ubuntu-latest
            name: ubuntu-latest, Eval ingest
            testSet: evalingest
            # Fixed by the Makefile's test-evalingest target.
            suite: evalingest
            timeout: 16
          - os: windows-latest
            name: windows-latest
            suite: windows
            timeout: 34
          - os: windows-latest
            name: windows-latest
            testSet: lint
            timeout: 21
          - os: macos-latest
            name: macos-latest
            suite: macos
            timeout: 29
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Set cache paths before setup-go and the Go cache restore.
      - name: Prepare Windows Go paths
        uses: $/.github/actions/windows-go-paths

      - uses: actions/setup-go@v7.0.0
        id: setup_go
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go caches
        uses: $/.github/actions/go-cache-restore
        with:
          group: test-${{ runner.os }}-${{ runner.arch }}
          owner: ${{ matrix.testSet != 'lint' && (runner.os != 'Linux' || matrix.testSet == 'other') }}

      - uses: kenn-io/kit/.github/actions/kit-retry@v0.48.3

      - name: Prepare SQLite header
        if: runner.os == 'Linux'
        run: |
          make sqlite-vec-header
          echo "CGO_CFLAGS=-O2 -g -I$GITHUB_WORKSPACE/.sqlite-include" >> "$GITHUB_ENV"

      - name: Setup MinGW (Windows)
        if: runner.os == 'Windows'
        id: setup_mingw
        continue-on-error: true
        uses: msys2/setup-msys2@v2.33.0
        with:
          msystem: MINGW64
          update: false
          install: ${{ env.MSYS2_PACKAGES }}
          path-type: inherit

      - name: Setup MinGW (Windows, retry on transient failure)
        if: runner.os == 'Windows' && steps.setup_mingw.outcome == 'failure'
        uses: msys2/setup-msys2@v2.33.0
        with:
          msystem: MINGW64
          update: false
          install: ${{ env.MSYS2_PACKAGES }}
          path-type: inherit

      - name: Restore pricing snapshot
        shell: bash
        run: kit-retry 3 5 go run ./internal/pricing/cmd/litellm-snapshot -restore

      - name: Run Go tests (Linux, single package)
        if: runner.os == 'Linux' && matrix.package != ''
        run: go tool gotestsum --format pkgname-and-test-fails --format-icons text --jsonfile gotestsum/${{ matrix.suite }}.json --rerun-fails=2 --rerun-fails-report gotestsum/${{ matrix.suite }}-reruns.txt --packages "${{ matrix.package }}" -- -tags "fts5" -count=1 -timeout=20m
        env:
          CGO_ENABLED: "1"

      # Sync and DuckDB run in separate normal Linux jobs.
      - name: Run other Go tests (Linux)
        if: runner.os == 'Linux' && matrix.testSet == 'other'
        shell: bash
        run: |
          packages="$(go list -tags fts5 ./... | grep -vE '/(cmd/perfsim|internal/(duckdb|sync))$')"
          go tool gotestsum --format pkgname-and-test-fails --format-icons text --jsonfile gotestsum/${{ matrix.suite }}.json --rerun-fails=2 --rerun-fails-report gotestsum/${{ matrix.suite }}-reruns.txt --packages "$packages" -- -tags "fts5" -count=1 -timeout=20m
        env:
          CGO_ENABLED: "1"

      - name: Run Go tests (Windows)
        if: runner.os == 'Windows' && matrix.testSet != 'lint'
        shell: pwsh
        run: |
          # Isolated packages run in their own jobs below so they do not
          # compete for this runner's package workers and timeout budget.
          $packages = @(go list ./...)
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          $isolatedPackages = @(
            'go.kenn.io/agentsview/cmd/agentsview'
            'go.kenn.io/agentsview/cmd/perfsim'
            'go.kenn.io/agentsview/internal/capture'
            'go.kenn.io/agentsview/internal/db'
            'go.kenn.io/agentsview/internal/duckdb'
            'go.kenn.io/agentsview/internal/parser'
            'go.kenn.io/agentsview/internal/sync'
          )
          $packages = $packages | Where-Object { $_ -notin $isolatedPackages }
          go tool gotestsum --format pkgname-and-test-fails --format-icons text --jsonfile gotestsum/${{ matrix.suite }}.json --rerun-fails=2 --rerun-fails-report gotestsum/${{ matrix.suite }}-reruns.txt --packages ($packages -join ' ') -- -tags "fts5" -count=1 -timeout=20m
        env:
          CGO_ENABLED: "1"

      - name: Resolve linter version
        id: linter_version
        if: runner.os == 'macOS' || (runner.os == 'Windows' && matrix.testSet == 'lint')
        shell: bash
        run: |
          version="$(sed -nE "/^[[:space:]]*GOLANGCI_LINT_VERSION[[:space:]]*[?:]?[[:space:]]*=/ { s/^[^=]*=//; s/#.*//; s/^[[:space:]\"']+//; s/[[:space:]\"']+$//; p; q; }" Makefile)"
          if [ -z "$version" ]; then
            echo "Makefile GOLANGCI_LINT_VERSION must be nonempty" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore Windows linter cache
        if: runner.os == 'Windows' && matrix.testSet == 'lint'
        uses: $/.github/actions/go-cache-restore
        with: &linter-cache
          group: lint-${{ runner.os }}-${{ runner.arch }}-${{ steps.linter_version.outputs.version }}-${{ hashFiles('.custom-gcl.yml') }}-${{ steps.setup_go.outputs.go-version }}
          include-go-cache: "false"
          owner: "true"
          extra-path: ${{ runner.temp }}/golangci-lint

      - name: Prepare Go linters (Windows)
        id: prepare_windows_linter
        if: runner.os == 'Windows' && matrix.testSet == 'lint'
        shell: msys2 {0}
        run: |
          set -e
          export GOBIN="$GOLANGCI_LINT_CACHE/bin"
          linter_dir="$(cygpath -u "$GOBIN")"
          export PATH="$linter_dir:$PATH"
          if [ -f "$linter_dir/custom-gcl.exe" ]; then exit 0; fi
          mkdir -p "$linter_dir"
          kit-retry 3 5 make lint-tools nilaway-golangci-build
          mv custom-gcl.exe "$linter_dir/custom-gcl.exe"
        env:
          CGO_ENABLED: "1"
          GOLANGCI_LINT_CACHE: ${{ runner.temp }}/golangci-lint

      - name: Run Go linters (Windows)
        if: runner.os == 'Windows' && matrix.testSet == 'lint'
        shell: pwsh
        run: |
          # Windows-only files never reach the Linux lint job.
          $linterDir = Join-Path $env:GOLANGCI_LINT_CACHE 'bin'
          $customLinter = Join-Path $linterDir 'custom-gcl.exe'
          & $customLinter run ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
          CGO_ENABLED: "1"
          GOLANGCI_LINT_CACHE: ${{ runner.temp }}/golangci-lint

      - name: Save Windows linter cache
        if: ${{ !cancelled() && runner.os == 'Windows' && matrix.testSet == 'lint' && steps.prepare_windows_linter.outcome == 'success' }}
        continue-on-error: true
        uses: $/.github/actions/go-cache-save

      - name: Run archive, CLI, signing, and volume identity tests (macOS)
        if: runner.os == 'macOS'
        run: go tool gotestsum --format pkgname-and-test-fails --format-icons text --jsonfile gotestsum/${{ matrix.suite }}.json --rerun-fails=2 --rerun-fails-report gotestsum/${{ matrix.suite }}-reruns.txt --packages "./internal/db ./internal/rawcapture ./internal/requestsign ./cmd/agentsview ./internal/volumeid" -- -tags "fts5" -count=1 -timeout=10m
        env:
          CGO_ENABLED: "1"

      - name: Run file identity and signing race tests (macOS)
        if: runner.os == 'macOS'
        run: go tool gotestsum --format pkgname-and-test-fails --format-icons text --jsonfile gotestsum/macos-race.json --rerun-fails=2 --rerun-fails-report gotestsum/macos-race-reruns.txt --packages "./internal/volumeid ./internal/rawcapture ./internal/requestsign" -- -race -tags fts5 -count=1 -timeout=10m
        env:
          CGO_ENABLED: "1"

      - name: Run eval-ingest build-tag tests
        if: matrix.testSet == 'evalingest'
        run: make test-evalingest

      - name: Upload gotestsum results
        if: always() && matrix.suite != ''
        uses: actions/upload-artifact@v7.0.2
        with:
          name: gotestsum-${{ matrix.suite }}-attempt-${{ github.run_attempt }}
          path: gotestsum/${{ matrix.suite }}.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload gotestsum macos-race results
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: gotestsum-macos-race-attempt-${{ github.run_attempt }}
          path: gotestsum/macos-race.json
          retention-days: 14
          if-no-files-found: ignore

      - &print-slowest-tests
        name: Print slowest tests
        if: always()
        shell: bash
        run: |
          for f in gotestsum/*.json; do
            [ -f "$f" ] || continue
            go tool gotestsum tool slowest --jsonfile "$f" --num 10 || true
          done

      - name: Save Go caches
        if: matrix.testSet != 'lint' && (runner.os != 'Linux' || matrix.testSet == 'other')
        uses: $/.github/actions/go-cache-save

      # Save the test group before the linter restore replaces GO_CACHE_*.
      - name: Restore macOS linter cache
        if: runner.os == 'macOS'
        uses: $/.github/actions/go-cache-restore
        with: *linter-cache

      - name: Prepare Go linters (macOS)
        id: prepare_macos_linter
        if: runner.os == 'macOS'
        run: |
          export PATH="$GOBIN:$PATH"
          # The cache key validates the binary without checkout timestamps.
          if [ ! -x "$GOBIN/custom-gcl" ]; then
            mkdir -p "$GOBIN"
            kit-retry 3 5 make lint-tools nilaway-golangci-build
            mv custom-gcl "$GOBIN/custom-gcl"
          fi
        env:
          CGO_ENABLED: "1"
          GOBIN: ${{ runner.temp }}/golangci-lint/bin

      - name: Run Go linters (macOS)
        if: runner.os == 'macOS'
        run: '"$GOBIN/custom-gcl" run ./internal/volumeid ./internal/rawcapture ./internal/requestsign'
        env:
          CGO_ENABLED: "1"
          GOBIN: ${{ runner.temp }}/golangci-lint/bin
          GOLANGCI_LINT_CACHE: ${{ runner.temp }}/golangci-lint

      - name: Save macOS linter cache
        if: ${{ !cancelled() && runner.os == 'macOS' && steps.prepare_macos_linter.outcome == 'success' }}
        continue-on-error: true
        uses: $/.github/actions/go-cache-save

  # Isolated Windows suites share setup; each matrix entry gets its own runner.
  test-isolated-packages-windows:
    needs: changes
    if: *go-lane
    name: Go Test (windows-latest, ${{ matrix.name }})
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: CLI A-P
            suite: windows-cli-a-p
            package: ./cmd/agentsview
            run: &cli-test-prefix '^Test[A-P]'
          - name: CLI remaining
            suite: windows-cli-rest
            package: ./cmd/agentsview
            skip: *cli-test-prefix
          - name: Capture
            suite: windows-capture
            package: ./internal/capture
          - name: Simulator
            suite: windows-perfsim
            package: ./cmd/perfsim
          - name: Database, Parser
            suite: windows-db-parser
            package: ./internal/db ./internal/parser
          # Complementary filters keep every sync test in exactly one job.
          - name: Sync A-R
            suite: windows-sync-a-r
            package: ./internal/sync
            run: &sync-test-prefix '^Test[A-R]'
          - name: Sync remaining
            suite: windows-sync-rest
            package: ./internal/sync
            skip: *sync-test-prefix
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare Windows Go paths
        uses: $/.github/actions/windows-go-paths

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go caches
        uses: $/.github/actions/go-cache-restore
        with:
          group: test-${{ runner.os }}-${{ runner.arch }}

      - name: Setup MinGW
        id: setup_mingw
        continue-on-error: true
        uses: msys2/setup-msys2@v2.33.0
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc
          path-type: inherit

      - name: Setup MinGW (retry on transient failure)
        if: steps.setup_mingw.outcome == 'failure'
        uses: msys2/setup-msys2@v2.33.0
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc
          path-type: inherit

      - uses: kenn-io/kit/.github/actions/kit-retry@v0.48.3

      - name: Restore pricing snapshot
        shell: bash
        run: kit-retry 3 5 go run ./internal/pricing/cmd/litellm-snapshot -restore

      # The Windows system tree and the runner's data volume have parent
      # permissions that capture deliberately rejects. Use a private directory
      # directly on the system drive for this job's fixtures.
      - name: Prepare capture test temporary directory
        if: contains(matrix.package, './internal/capture')
        shell: pwsh
        run: |
          $testTemp = Join-Path $env:SystemDrive ("agentsview-ci-" + [guid]::NewGuid().ToString("N"))
          New-Item -ItemType Directory -Path $testTemp | Out-Null
          icacls $testTemp /inheritance:r /grant:r '*S-1-5-18:(OI)(CI)F' '*S-1-5-32-544:(OI)(CI)F'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "TMP=$testTemp" >> $env:GITHUB_ENV
          "TEMP=$testTemp" >> $env:GITHUB_ENV
          "AGENTSVIEW_CI_TEMP=$testTemp" >> $env:GITHUB_ENV

      - name: Run ${{ matrix.name }} tests
        shell: pwsh
        run: |
          go tool gotestsum --format pkgname-and-test-fails --format-icons text --jsonfile gotestsum/${{ matrix.suite }}.json --rerun-fails=2 --rerun-fails-report gotestsum/${{ matrix.suite }}-reruns.txt --packages "${{ matrix.package }}" -- -tags "fts5" -run '${{ matrix.run || '.' }}' -skip '${{ matrix.skip || '^$' }}' -count=1 -timeout=20m
        env:
          CGO_ENABLED: "1"

      - name: Remove capture test temporary directory
        if: always() && contains(matrix.package, './internal/capture') && env.AGENTSVIEW_CI_TEMP != ''
        shell: pwsh
        run: Remove-Item -LiteralPath $env:AGENTSVIEW_CI_TEMP -Recurse -Force

      - name: Upload gotestsum results
        if: always() && matrix.suite != ''
        uses: actions/upload-artifact@v7.0.2
        with:
          name: gotestsum-${{ matrix.suite }}-attempt-${{ github.run_attempt }}
          path: gotestsum/${{ matrix.suite }}.json
          retention-days: 14
          if-no-files-found: ignore

      # Diagnostics only: the test step decides the job result. The runner
      # turns a timed-out step into a success when continue-on-error is set,
      # so a stalled summary cannot fail a job whose tests passed.
      - name: Summarize ${{ matrix.name }} test timing
        if: always()
        continue-on-error: true
        timeout-minutes: 2
        shell: pwsh
        run: |
          $eventsPath = "gotestsum/${{ matrix.suite }}.json"
          if (-not (Test-Path $eventsPath)) {
            Write-Warning "Go test event log was not created"
            exit 0
          }

          $events = @(
            Get-Content $eventsPath | ForEach-Object {
              try {
                $_ | ConvertFrom-Json -ErrorAction Stop
              } catch {
                # Keep the raw artifact authoritative if a killed process left
                # one incomplete line at the end of the stream.
              }
            }
          )
          if ($events.Count -eq 0) {
            Write-Warning "Go test event log contains no complete JSON events"
            exit 0
          }

          $terminal = @{}
          $completed = @(
            $events | Where-Object {
              $_.Test -and $_.Action -in @("pass", "fail", "skip")
            }
          )
          foreach ($event in $completed) {
            $terminal[$event.Test] = $event.Action
          }

          $seenActive = @{}
          $active = @(
            $events |
              Where-Object { $_.Test -and $_.Action -eq "run" } |
              Sort-Object Time -Descending |
              Where-Object {
                if ($terminal.ContainsKey($_.Test) -or $seenActive.ContainsKey($_.Test)) {
                  return $false
                }
                $seenActive[$_.Test] = $true
                return $true
              }
          )

          $summary = [System.Collections.Generic.List[string]]::new()
          $summary.Add("## ${{ matrix.name }} Go test diagnostics")
          $summary.Add("")
          $summary.Add("### Tests active when the process ended")
          $summary.Add("")
          if ($active.Count -eq 0) {
            $summary.Add("None.")
          } else {
            foreach ($event in $active | Select-Object -First 25) {
              $summary.Add("- ``$($event.Test.Replace('|', '\|'))`` (started $($event.Time))")
            }
          }

          $summary.Add("")
          $summary.Add("### Slowest completed tests")
          $summary.Add("")
          $summary.Add("| Test | Result | Seconds |")
          $summary.Add("| --- | --- | ---: |")
          foreach ($event in $completed |
            Sort-Object { [double]$_.Elapsed } -Descending |
            Select-Object -First 25) {
            $name = $event.Test.Replace('|', '\|')
            $elapsed = "{0:N3}" -f [double]$event.Elapsed
            $summary.Add("| ``$name`` | $($event.Action) | $elapsed |")
          }

          $summary.Add("")
          $summary.Add("### Last completed tests")
          $summary.Add("")
          $summary.Add("| Completed | Test | Result | Seconds |")
          $summary.Add("| --- | --- | --- | ---: |")
          foreach ($event in $completed |
            Sort-Object Time -Descending |
            Select-Object -First 25) {
            $name = $event.Test.Replace('|', '\|')
            $elapsed = "{0:N3}" -f [double]$event.Elapsed
            $summary.Add("| $($event.Time) | ``$name`` | $($event.Action) | $elapsed |")
          }

          $summary | Write-Output
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

  # Keep the derived-mirror suite concurrent with the main Windows package set.
  test-duckdb-windows:
    needs: changes
    if: *go-lane
    name: Go Test (windows-latest, DuckDB)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare Windows Go paths
        uses: $/.github/actions/windows-go-paths

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go caches
        uses: $/.github/actions/go-cache-restore
        with:
          group: test-${{ runner.os }}-${{ runner.arch }}

      - name: Setup MinGW
        id: setup_mingw
        continue-on-error: true
        uses: msys2/setup-msys2@v2.33.0
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc
          path-type: inherit

      - name: Setup MinGW (retry on transient failure)
        if: steps.setup_mingw.outcome == 'failure'
        uses: msys2/setup-msys2@v2.33.0
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc
          path-type: inherit

      - uses: kenn-io/kit/.github/actions/kit-retry@v0.48.3

      - name: Restore pricing snapshot
        shell: bash
        run: kit-retry 3 5 go run ./internal/pricing/cmd/litellm-snapshot -restore

      - name: Run DuckDB tests
        run: go tool gotestsum --format pkgname-and-test-fails --format-icons text --jsonfile gotestsum/windows-duckdb.json --rerun-fails=2 --rerun-fails-report gotestsum/windows-duckdb-reruns.txt --packages "./internal/duckdb" -- -tags "fts5" -count=1 -timeout=20m
        env:
          CGO_ENABLED: "1"

      - name: Upload gotestsum windows-duckdb results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: gotestsum-windows-duckdb-attempt-${{ github.run_attempt }}
          path: gotestsum/windows-duckdb.json
          retention-days: 14
          if-no-files-found: ignore

      - *print-slowest-tests

  test-race:
    env:
      DOWNLOAD_RETRY: kit-retry 3 5
    needs: changes
    if: *go-lane
    name: Go Test (race detector, ${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Sync A-R
            suite: race-sync-a-r
            runner: ubuntu-latest
            package: ./internal/sync
            run: *sync-test-prefix
          - name: Sync remaining
            suite: race-sync-rest
            runner: ubuntu-latest
            package: ./internal/sync
            skip: *sync-test-prefix
          - name: CLI A-P
            suite: race-cli-a-p
            runner: ubuntu-latest
            package: ./cmd/agentsview
            run: *cli-test-prefix
          - name: CLI remaining
            suite: race-cli-rest
            runner: ubuntu-latest
            package: ./cmd/agentsview
            skip: *cli-test-prefix
          - name: Database and Server
            suite: race-db-server
            runner: ubuntu-latest
            package: ./internal/db ./internal/server
          - name: Simulator
            suite: race-perfsim
            runner: ubuntu-latest
            package: ./cmd/perfsim
          - name: Other packages
            suite: race-other
            runner: ubuntu-latest
            testSet: other
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go caches
        uses: $/.github/actions/go-cache-restore
        with:
          group: race-linux
          owner: ${{ matrix.testSet == 'other' }}

      - uses: kenn-io/kit/.github/actions/kit-retry@v0.48.3

      - name: Prepare SQLite header
        if: runner.os == 'Linux'
        run: |
          make sqlite-vec-header
          echo "CGO_CFLAGS=-O2 -g -I$GITHUB_WORKSPACE/.sqlite-include" >> "$GITHUB_ENV"

      - name: Restore pricing snapshot
        run: kit-retry 3 5 go run ./internal/pricing/cmd/litellm-snapshot -restore

      # Keep exclusions aligned with the explicit race matrix packages.
      # DuckDB runs without -race in its Linux shard. Limit package fan-out
      # because highly parallel race runs can exhaust deadlines.
      - name: Run Go tests (race detector)
        if: matrix.testSet == 'other'
        shell: bash
        run: |
          packages="$(go list ./... | grep -vE '/(cmd/(agentsview|perfsim)|internal/(db|server|duckdb|sync))$')"
          go tool gotestsum --format pkgname-and-test-fails --format-icons text --jsonfile gotestsum/${{ matrix.suite }}.json --rerun-fails=2 --rerun-fails-report gotestsum/${{ matrix.suite }}-reruns.txt --packages "$packages" -- -p 4 -tags "fts5" -race -count=1 -timeout=20m
        env:
          CGO_ENABLED: "1"

      - name: Run ${{ matrix.name }} tests (race detector)
        if: matrix.package != ''
        run: go tool gotestsum --format pkgname-and-test-fails --format-icons text --jsonfile gotestsum/${{ matrix.suite }}.json --rerun-fails=2 --rerun-fails-report gotestsum/${{ matrix.suite }}-reruns.txt --packages "${{ matrix.package }}" -- -tags "fts5" -race -run '${{ matrix.run || '.' }}' -skip '${{ matrix.skip || '^$' }}' -count=1 -timeout=20m
        env:
          CGO_ENABLED: "1"

      - name: Upload gotestsum results
        if: always() && matrix.suite != ''
        uses: actions/upload-artifact@v7.0.2
        with:
          name: gotestsum-${{ matrix.suite }}-attempt-${{ github.run_attempt }}
          path: gotestsum/${{ matrix.suite }}.json
          retention-days: 14
          if-no-files-found: ignore

      - *print-slowest-tests

      # This job owns the shared cache, including tests run by the other shards.
      - name: Warm moved race test builds for the next run
        if: matrix.testSet == 'other' && github.event_name == 'push' && github.ref == 'refs/heads/main' && env.GO_CACHE_HIT != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/race-test-binaries"
          go test -p 4 -tags "fts5" -race -c -o "$RUNNER_TEMP/race-test-binaries/" ./cmd/agentsview ./internal/db ./internal/server
        env:
          CGO_ENABLED: "1"

      - name: Save Go caches
        if: matrix.testSet == 'other'
        uses: $/.github/actions/go-cache-save

  # Owns Windows Rust test coverage for PR and main-push desktop artifacts.
  desktop-windows-unit:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.all == 'true' || contains(fromJSON(needs.changes.outputs.groups), 'desktop')) }}
    name: Desktop Unit Tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Cache Rust dependencies
        uses: step-security/rust-cache@v2.9.2
        with:
          workspaces: desktop/src-tauri -> target
          # Pull requests restore main's build without saving their own copy.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Prepare placeholder sidecar resource
        shell: pwsh
        run: |
          $hostTriple = (rustc -vV | Select-String '^host: ').ToString() -replace '^host:\s+', ''
          if (-not $hostTriple) {
            throw "could not determine Rust host triple"
          }
          New-Item -ItemType Directory -Force desktop/src-tauri/binaries | Out-Null
          New-Item -ItemType File -Force "desktop/src-tauri/binaries/agentsview-$hostTriple.exe" | Out-Null

      - uses: kenn-io/kit/.github/actions/kit-retry@v0.48.3

      - name: Fetch Windows desktop Rust dependencies
        shell: bash
        run: kit-retry 3 10 cargo fetch --locked --manifest-path desktop/src-tauri/Cargo.toml

      - name: Run Windows desktop unit tests
        run: cargo test --locked --manifest-path desktop/src-tauri/Cargo.toml --lib

  integration:
    env:
      DOWNLOAD_RETRY: kit-retry 3 5
    needs: changes
    if: *go-lane
    name: Integration (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 32
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: PostgreSQL core
            postgres-target: test-postgres-core-fast-ci
          - name: PostgreSQL raw-sync and ClickHouse
            postgres-target: test-postgres-raw-sync-ci test-postgres-core-heavy-ci
            clickhouse: true
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: agentsview_test
          POSTGRES_PASSWORD: agentsview_test_password
          POSTGRES_DB: agentsview_test
        ports:
          - 5433:5432
        # PG18 keeps its data under /var/lib/postgresql/18/docker. The suite
        # repeatedly rebuilds schemas; keep this disposable cluster in memory.
        options: >-
          --tmpfs /var/lib/postgresql:rw,size=4g
          --health-cmd "pg_isready -U agentsview_test -d agentsview_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
      clickhouse:
        # An empty image omits this service for the PostgreSQL-only lane.
        image: ${{ matrix.clickhouse && 'clickhouse/clickhouse-server:26.8' || '' }}
        env:
          CLICKHOUSE_SKIP_USER_SETUP: "1"
        ports:
          - 18123:8123
          - 19000:9000
        options: >-
          --tmpfs /var/lib/clickhouse
          --health-cmd "clickhouse-client --query 'SELECT 1'"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go caches
        uses: $/.github/actions/go-cache-restore
        with:
          group: test-${{ runner.os }}-${{ runner.arch }}

      - uses: kenn-io/kit/.github/actions/kit-retry@v0.48.3

      - name: Restore pricing snapshot
        run: kit-retry 3 5 go run ./internal/pricing/cmd/litellm-snapshot -restore

      - name: Run PostgreSQL integration tests
        run: make ${{ matrix.postgres-target }}
        env:
          CGO_ENABLED: "1"
          TEST_PG_URL: postgres://agentsview_test:agentsview_test_password@localhost:5433/agentsview_test?sslmode=disable

      - name: Run ClickHouse integration tests
        if: matrix.clickhouse
        run: make test-clickhouse-ci
        env:
          CGO_ENABLED: "1"
          TEST_CLICKHOUSE_URL: clickhouse://localhost:19000/default

      # Suite names are fixed by the Makefile CI targets. Each leg uploads
      # only the suites it ran.
      - name: Upload gotestsum postgres-core-fast results
        if: failure() || github.run_attempt > 1 || hashFiles('gotestsum/postgres-core-fast-reruns.txt', 'gotestsum/postgres-core-fast-activity-reruns.txt') != ''
        uses: actions/upload-artifact@v7.0.2
        with:
          name: gotestsum-postgres-core-fast-attempt-${{ github.run_attempt }}
          path: |
            gotestsum/postgres-core-fast.json
            gotestsum/postgres-core-fast-activity.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload gotestsum postgres-core-fast-service results
        if: failure() || github.run_attempt > 1 || hashFiles('gotestsum/postgres-core-fast-service-reruns.txt') != ''
        uses: actions/upload-artifact@v7.0.2
        with:
          name: gotestsum-postgres-core-fast-service-attempt-${{ github.run_attempt }}
          path: gotestsum/postgres-core-fast-service.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload gotestsum postgres-raw-sync results
        if: failure() || github.run_attempt > 1 || hashFiles('gotestsum/postgres-raw-sync-reruns.txt') != ''
        uses: actions/upload-artifact@v7.0.2
        with:
          name: gotestsum-postgres-raw-sync-attempt-${{ github.run_attempt }}
          path: gotestsum/postgres-raw-sync.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload gotestsum postgres-core-heavy results
        if: failure() || github.run_attempt > 1 || hashFiles('gotestsum/postgres-core-heavy-reruns.txt') != ''
        uses: actions/upload-artifact@v7.0.2
        with:
          name: gotestsum-postgres-core-heavy-attempt-${{ github.run_attempt }}
          path: gotestsum/postgres-core-heavy.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload gotestsum clickhouse results
        if: failure() || github.run_attempt > 1 || hashFiles('gotestsum/clickhouse-reruns.txt') != ''
        uses: actions/upload-artifact@v7.0.2
        with:
          name: gotestsum-clickhouse-attempt-${{ github.run_attempt }}
          path: gotestsum/clickhouse.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload gotestsum clickhouse-service results
        if: failure() || github.run_attempt > 1 || hashFiles('gotestsum/clickhouse-service-reruns.txt') != ''
        uses: actions/upload-artifact@v7.0.2
        with:
          name: gotestsum-clickhouse-service-attempt-${{ github.run_attempt }}
          path: gotestsum/clickhouse-service.json
          retention-days: 14
          if-no-files-found: ignore

  e2e:
    needs: changes
    if: *frontend-lane
    name: e2e (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    env:
      PW_TEST_CONNECT_WS_ENDPOINT: ws://127.0.0.1:3000/
      DOWNLOAD_RETRY: kit-retry 3 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            timeout: 42
          - browser: webkit
            timeout: 24
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go caches
        uses: $/.github/actions/go-cache-restore
        with:
          group: test-${{ runner.os }}-${{ runner.arch }}

      - uses: kenn-io/kit/.github/actions/kit-retry@v0.48.3

      - name: Prepare SQLite header
        if: runner.os == 'Linux'
        run: |
          make sqlite-vec-header
          echo "CGO_CFLAGS=-O2 -g -I$GITHUB_WORKSPACE/.sqlite-include" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "26.12.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: kit-retry 3 5 npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend
        env:
          VITE_PROJECT_MAPPING_WORKSPACE: "true"

      - name: Embed frontend in Go source tree
        run: |
          rm -rf internal/web/dist
          cp -r frontend/dist internal/web/dist

      - name: Restore pricing snapshot
        run: kit-retry 3 5 go run ./internal/pricing/cmd/litellm-snapshot -restore

      - name: Pre-build Go binaries
        run: |
          CGO_ENABLED=1 go build -tags fts5 \
            -o /tmp/testfixture ./cmd/testfixture
          CGO_ENABLED=1 go build -tags fts5 \
            -o /tmp/agentsview ./cmd/agentsview
        env:
          CGO_ENABLED: "1"

      # The first-paint check reads the pages the binary serves from its
      # embedded build: the root and a client route, which takes the SPA
      # fallback.
      - name: Start the server for the first-paint check
        if: matrix.browser == 'chromium'
        timeout-minutes: 2
        run: |
          AGENTSVIEW_E2E_PORT=8095 bash scripts/e2e-server.sh > "$RUNNER_TEMP/first-paint-server.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/first-paint-server.pid"
          # workflowretry: allow Local readiness probe; the loop retries while the server starts.
          until curl -sf http://127.0.0.1:8095/ > /dev/null; do
            kill -0 "$!" 2> /dev/null || { cat "$RUNNER_TEMP/first-paint-server.log"; exit 1; }
            sleep 1
          done
        env:
          E2E_PREBUILT_FIXTURE: /tmp/testfixture
          E2E_PREBUILT_SERVER: /tmp/agentsview

      - name: Check that pages paint with their stylesheets and fonts
        if: matrix.browser == 'chromium'
        uses: kenn-io/actions/first-paint@98e621dcda6f5d7de8590248e353e3d55c28ecf2  # main
        with:
          urls: |
            http://127.0.0.1:8095/
            http://127.0.0.1:8095/sessions/test-session-large-1500

      - name: Stop the first-paint server
        if: always() && matrix.browser == 'chromium'
        run: |
          if [ -f "$RUNNER_TEMP/first-paint-server.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/first-paint-server.pid")" || true
          fi

      - name: Start Playwright browser server
        id: browser_server
        timeout-minutes: 10
        run: |
          version=$(node -p 'require("./node_modules/@playwright/test/package.json").version')
          image="mcr.microsoft.com/playwright:v$version-noble"
          if ! kit-retry 3 5 docker pull "$image"; then
            echo "::error::Could not pull $image. Microsoft may not have published the image for this @playwright/test version yet."
            exit 1
          fi
          cid=$(docker run -d --name playwright-browser-server --init --ipc=host --network host \
            -v "$PWD:$PWD:ro" -w "$PWD" \
            "$image" \
            node node_modules/@playwright/test/cli.js run-server \
            --port 3000 --host 127.0.0.1 --unsafe)
          # workflowretry: allow Poll the local service for readiness.
          until curl -s http://127.0.0.1:3000/; do
            [ "$(docker inspect -f '{{.State.Running}}' "$cid")" = true ] || { docker logs "$cid"; exit 1; }
            sleep 1
          done
        working-directory: frontend

      # Upload each JSON report before the next Playwright run clears
      # test-results/.
      - name: Run E2E tests
        run: npx playwright test --reporter=list,json --project=${{ matrix.browser }}
        working-directory: frontend
        env:
          E2E_PREBUILT_FIXTURE: /tmp/testfixture
          E2E_PREBUILT_SERVER: /tmp/agentsview
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/playwright/e2e-${{ matrix.browser }}.json
          PROJECT_MAPPING_WORKSPACE_E2E_ENABLED: "true"

      - name: Upload Playwright E2E report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-e2e-${{ matrix.browser }}-attempt-${{ github.run_attempt }}
          path: frontend/test-results/playwright/e2e-${{ matrix.browser }}.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Run DuckDB E2E tests
        if: matrix.browser == 'chromium'
        run: make e2e-duckdb
        env:
          E2E_PREBUILT_FIXTURE: /tmp/testfixture
          E2E_PREBUILT_SERVER: /tmp/agentsview
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/playwright/e2e-duckdb.json
          PROJECT_MAPPING_WORKSPACE_E2E_ENABLED: "true"

      - name: Upload Playwright DuckDB E2E report
        if: always() && matrix.browser == 'chromium'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-e2e-duckdb-attempt-${{ github.run_attempt }}
          path: frontend/test-results/playwright/e2e-duckdb.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Print Playwright browser server logs on failure
        if: failure() && steps.browser_server.outcome == 'success'
        run: docker logs playwright-browser-server
