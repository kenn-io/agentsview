name: CI

env:
  # "|" falls back to direct on any proxy error (e.g. HTTP/2 INTERNAL_ERROR), not just 404/410.
  GOPROXY: "https://proxy.golang.org|direct"
  # Compile with module-relative source paths so identical source shares one
  # Go build cache across checkouts and worktrees.
  GOFLAGS: -trimpath

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
  # Run on every pull request regardless of base branch so stacked PRs that
  # target another feature branch (not just main) still get the full test,
  # lint, and e2e suite. The expensive desktop/tauri bundle builds are gated
  # to main separately in desktop-artifacts.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.linter == 'nilaway' && 30 || 10 }}
    strategy:
      fail-fast: false
      matrix:
        linter: [golangci, nilaway]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go caches
        uses: ./.github/actions/go-cache-restore
        with:
          group: lint-${{ matrix.linter }}
          extra-path: ~/.cache/golangci-lint

      - name: Prepare SQLite header
        if: runner.os == 'Linux'
        run: |
          make sqlite-vec-header
          echo "CGO_CFLAGS=-O2 -g -I$GITHUB_WORKSPACE/.sqlite-include" >> "$GITHUB_ENV"

      - name: Prepare SQLite header
        if: runner.os == 'Linux'
        run: |
          make sqlite-vec-header
          echo "CGO_CFLAGS=-O2 -g -I$GITHUB_WORKSPACE/.sqlite-include" >> "$GITHUB_ENV"

      - name: Prepare SQLite header
        if: runner.os == 'Linux'
        run: |
          make sqlite-vec-header
          echo "CGO_CFLAGS=-O2 -g -I$GITHUB_WORKSPACE/.sqlite-include" >> "$GITHUB_ENV"

      - name: Install lint tools
        run: |
          make lint-tools
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run Go linters
        if: matrix.linter == 'golangci'
        run: make lint-config-check lint-sql lint-golangci-ci

      - name: Run NilAway
        if: matrix.linter == 'nilaway'
        run: make nilaway

      - name: Check Huma API contract
        if: matrix.linter == 'golangci'
        run: go run go.kenn.io/kit/cmd/huma-check@e9840a327158da2559458186b253b0c15a5e2c2b -fix=false ./...

      - name: Save Go caches
        uses: ./.github/actions/go-cache-save

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "24.22.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go caches
        uses: ./.github/actions/go-cache-restore
        with:
          group: test-${{ runner.os }}-${{ runner.arch }}

      - name: Prepare SQLite header
        if: runner.os == 'Linux'
        run: |
          make sqlite-vec-header
          echo "CGO_CFLAGS=-O2 -g -I$GITHUB_WORKSPACE/.sqlite-include" >> "$GITHUB_ENV"

      - name: Generate pricing snapshot
        run: go run ./internal/pricing/cmd/litellm-snapshot

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Format, lint, and type-check (fix formatting with npm run fmt)
        # Runs before the slower checks so formatting mistakes show up
        # first. Lint warnings do not fail this step yet; errors and
        # unformatted files do.
        run: npm run check:vp
        working-directory: frontend

      - name: Type-check (svelte-check)
        run: npm run check
        working-directory: frontend

      - name: Design-system conformance (kit-ui-check)
        # Full rule set over all of src; legitimate exceptions carry inline
        # kit-ui-check-ignore markers with reasons (e.g. the app token
        # definitions in app.css).
        run: npm run check:kit-ui
        working-directory: frontend

      - name: Run frontend tests
        run: npm test
        working-directory: frontend

  frontend-node-26:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "26.12.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Run frontend tests
        run: npm test
        working-directory: frontend

  docs:
    name: Docs and scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.15"

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2

      - name: Install docs check tools
        run: |
          sudo find /etc/apt -type f \( -name '*.list' -o -name '*.sources' \) -exec sed -i -E \
            -e 's|https?://(azure\.)?archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
            -e 's|http://security\.ubuntu\.com/ubuntu|https://security.ubuntu.com/ubuntu|g' {} +
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Run docs check
        run: make docs-check

      - name: Run shell script tests
        run: |
          bash scripts/install_test.sh
          bash scripts/retry_test.sh
          bash scripts/e2e-server_test.sh
          bash desktop/scripts/test-repair-appimage-diricon.sh

  test:
    name: Go ${{ matrix.testSet == 'lint' && 'Lint' || 'Test' }} (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    env:
      MSYS2_PACKAGES: mingw-w64-x86_64-gcc ${{ matrix.testSet == 'lint' && 'make' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: ubuntu-latest, Sync
            package: ./internal/sync
          - os: ubuntu-latest
            name: ubuntu-latest, DuckDB
            package: ./internal/duckdb
          - os: ubuntu-latest
            name: ubuntu-latest, Other packages
            testSet: other
          - os: ubuntu-latest
            name: ubuntu-latest, Eval ingest
            testSet: evalingest
          - os: windows-latest
            name: windows-latest
          - os: windows-latest
            name: windows-latest
            testSet: lint
          - os: macos-latest
            name: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Set cache paths before setup-go and the Go cache restore.
      - name: Prepare Windows Go paths
        uses: ./.github/actions/windows-go-paths

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        id: setup_go
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go caches
        uses: ./.github/actions/go-cache-restore
        with:
          group: test-${{ runner.os }}-${{ runner.arch }}

      - name: Prepare SQLite header
        if: runner.os == 'Linux'
        run: |
          make sqlite-vec-header
          echo "CGO_CFLAGS=-O2 -g -I$GITHUB_WORKSPACE/.sqlite-include" >> "$GITHUB_ENV"

      - name: Setup MinGW (Windows)
        if: runner.os == 'Windows'
        id: setup_mingw
        continue-on-error: true
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e  # v2
        with:
          msystem: MINGW64
          update: false
          install: ${{ env.MSYS2_PACKAGES }}
          path-type: inherit

      - name: Setup MinGW (Windows, retry on transient failure)
        if: runner.os == 'Windows' && steps.setup_mingw.outcome == 'failure'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e  # v2
        with:
          msystem: MINGW64
          update: false
          install: ${{ env.MSYS2_PACKAGES }}
          path-type: inherit

      - name: Restore pricing snapshot
        run: go run ./internal/pricing/cmd/litellm-snapshot -restore

      - name: Run Go tests (Linux, single package)
        if: runner.os == 'Linux' && matrix.package != ''
        run: go test -tags "fts5" ${{ matrix.package }} -v -count=1 -timeout=20m
        env:
          CGO_ENABLED: "1"

      # Sync and DuckDB run in separate normal Linux jobs.
      - name: Run other Go tests (Linux)
        if: runner.os == 'Linux' && matrix.testSet == 'other'
        shell: bash
        run: go list -tags fts5 ./... | grep -vE '/internal/(duckdb|sync)$' | xargs go test -tags "fts5" -v -count=1 -timeout=20m
        env:
          CGO_ENABLED: "1"

      - name: Run Go tests (Windows)
        if: runner.os == 'Windows' && matrix.testSet != 'lint'
        shell: pwsh
        run: |
          # Isolated packages run in their own jobs below so they do not
          # compete for this runner's package workers and timeout budget.
          $packages = @(go list ./...)
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          $isolatedPackages = @(
            'go.kenn.io/agentsview/cmd/agentsview'
            'go.kenn.io/agentsview/internal/capture'
            'go.kenn.io/agentsview/internal/db'
            'go.kenn.io/agentsview/internal/duckdb'
            'go.kenn.io/agentsview/internal/parser'
            'go.kenn.io/agentsview/internal/sync'
          )
          $packages = $packages | Where-Object { $_ -notin $isolatedPackages }
          go test -tags "fts5" $packages -count=1 -timeout=20m
        env:
          CGO_ENABLED: "1"

      - name: Resolve Windows linter version
        id: windows_linter_version
        if: runner.os == 'Windows' && matrix.testSet == 'lint'
        shell: bash
        run: |
          version="$(sed -nE "s/^[[:space:]]*GOLANGCI_LINT_VERSION[[:space:]]*[?:]?[[:space:]]*=[[:space:]]*//; T; s/#.*//; s/^[[:space:]\"']+//; s/[[:space:]\"']+$//; p; q" Makefile)"
          if [ -z "$version" ]; then
            echo "Makefile GOLANGCI_LINT_VERSION must be nonempty" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore Windows linter cache
        if: runner.os == 'Windows' && matrix.testSet == 'lint'
        uses: ./.github/actions/go-cache-restore
        with:
          group: lint-${{ runner.os }}-${{ runner.arch }}-${{ steps.windows_linter_version.outputs.version }}-${{ hashFiles('.custom-gcl.yml') }}-${{ steps.setup_go.outputs.go-version }}
          include-go-cache: "false"
          extra-path: ${{ runner.temp }}/golangci-lint

      - name: Prepare Go linters (Windows)
        id: prepare_windows_linter
        if: runner.os == 'Windows' && matrix.testSet == 'lint'
        shell: msys2 {0}
        run: |
          set -e
          export GOBIN="$GOLANGCI_LINT_CACHE/bin"
          linter_dir="$(cygpath -u "$GOBIN")"
          export PATH="$linter_dir:$PATH"
          if [ -f "$linter_dir/custom-gcl.exe" ]; then exit 0; fi
          mkdir -p "$linter_dir"
          bash scripts/retry.sh 3 5 make lint-tools
          make nilaway-golangci-build
          mv custom-gcl.exe "$linter_dir/custom-gcl.exe"
        env:
          CGO_ENABLED: "1"
          GOLANGCI_LINT_CACHE: ${{ runner.temp }}/golangci-lint

      - name: Run Go linters (Windows)
        if: runner.os == 'Windows' && matrix.testSet == 'lint'
        shell: pwsh
        run: |
          # Windows-only files never reach the Linux lint job.
          $linterDir = Join-Path $env:GOLANGCI_LINT_CACHE 'bin'
          $customLinter = Join-Path $linterDir 'custom-gcl.exe'
          & $customLinter run ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
          CGO_ENABLED: "1"
          GOLANGCI_LINT_CACHE: ${{ runner.temp }}/golangci-lint

      - name: Save Windows linter cache
        if: ${{ !cancelled() && runner.os == 'Windows' && matrix.testSet == 'lint' && steps.prepare_windows_linter.outcome == 'success' }}
        continue-on-error: true
        uses: ./.github/actions/go-cache-save

      - name: Run archive, CLI, signing, and volume identity tests (macOS)
        if: runner.os == 'macOS'
        run: go test -tags "fts5" ./internal/db ./internal/rawcapture ./internal/requestsign ./cmd/agentsview ./internal/volumeid -count=1 -timeout=10m
        env:
          CGO_ENABLED: "1"

      - name: Run file identity and signing race tests and linters (macOS)
        if: runner.os == 'macOS'
        run: |
          go test -race -tags fts5 ./internal/volumeid ./internal/rawcapture ./internal/requestsign -count=1 -timeout=10m
          make lint-tools nilaway-golangci-build
          ./custom-gcl run ./internal/volumeid ./internal/rawcapture ./internal/requestsign
        env:
          CGO_ENABLED: "1"

      - name: Run eval-ingest build-tag tests
        if: matrix.testSet == 'evalingest'
        run: make test-evalingest

      - name: Save Go caches
        if: matrix.testSet != 'lint' && (runner.os != 'Linux' || matrix.testSet == 'other')
        uses: ./.github/actions/go-cache-save

  # Isolated Windows suites share setup; each matrix entry gets its own runner.
  test-isolated-packages-windows:
    name: Go Test (windows-latest, ${{ matrix.name }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: CLI A-P
            package: ./cmd/agentsview
            run: &cli-test-prefix '^Test[A-P]'
          - name: CLI remaining
            package: ./cmd/agentsview
            skip: *cli-test-prefix
          - name: Capture
            package: ./internal/capture
          - name: Database, Parser
            package: ./internal/db ./internal/parser
          # Complementary filters keep every sync test in exactly one job.
          - name: Sync A-R
            package: ./internal/sync
            run: &sync-test-prefix '^Test[A-R]'
          - name: Sync remaining
            package: ./internal/sync
            skip: *sync-test-prefix
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare Windows Go paths
        uses: ./.github/actions/windows-go-paths

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go caches
        uses: ./.github/actions/go-cache-restore
        with:
          group: test-${{ runner.os }}-${{ runner.arch }}

      - name: Setup MinGW
        id: setup_mingw
        continue-on-error: true
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e  # v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc
          path-type: inherit

      - name: Setup MinGW (retry on transient failure)
        if: steps.setup_mingw.outcome == 'failure'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e  # v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc
          path-type: inherit

      - name: Restore pricing snapshot
        run: go run ./internal/pricing/cmd/litellm-snapshot -restore

      # The Windows system tree and the runner's data volume have parent
      # permissions that capture deliberately rejects. Use a private directory
      # directly on the system drive for this job's fixtures.
      - name: Prepare capture test temporary directory
        if: contains(matrix.package, './internal/capture')
        shell: pwsh
        run: |
          $testTemp = Join-Path $env:SystemDrive ("agentsview-ci-" + [guid]::NewGuid().ToString("N"))
          New-Item -ItemType Directory -Path $testTemp | Out-Null
          icacls $testTemp /inheritance:r /grant:r '*S-1-5-18:(OI)(CI)F' '*S-1-5-32-544:(OI)(CI)F'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "TMP=$testTemp" >> $env:GITHUB_ENV
          "TEMP=$testTemp" >> $env:GITHUB_ENV
          "AGENTSVIEW_CI_TEMP=$testTemp" >> $env:GITHUB_ENV

      - name: Run ${{ matrix.name }} tests
        shell: pwsh
        run: |
          go test -json -tags "fts5" ${{ matrix.package }} -run '${{ matrix.run || '.' }}' -skip '${{ matrix.skip || '^$' }}' -count=1 -timeout=20m 2>&1 |
            Tee-Object -FilePath go-test-events.jsonl
          exit $LASTEXITCODE
        env:
          CGO_ENABLED: "1"

      - name: Remove capture test temporary directory
        if: always() && contains(matrix.package, './internal/capture') && env.AGENTSVIEW_CI_TEMP != ''
        shell: pwsh
        run: Remove-Item -LiteralPath $env:AGENTSVIEW_CI_TEMP -Recurse -Force

      - name: Summarize ${{ matrix.name }} test timing
        if: always()
        shell: pwsh
        run: |
          $eventsPath = "go-test-events.jsonl"
          if (-not (Test-Path $eventsPath)) {
            Write-Warning "Go test event log was not created"
            exit 0
          }

          $events = @(
            Get-Content $eventsPath | ForEach-Object {
              try {
                $_ | ConvertFrom-Json -ErrorAction Stop
              } catch {
                # Keep the raw artifact authoritative if a killed process left
                # one incomplete line at the end of the stream.
              }
            }
          )
          if ($events.Count -eq 0) {
            Write-Warning "Go test event log contains no complete JSON events"
            exit 0
          }

          $terminal = @{}
          $completed = @(
            $events | Where-Object {
              $_.Test -and $_.Action -in @("pass", "fail", "skip")
            }
          )
          foreach ($event in $completed) {
            $terminal[$event.Test] = $event.Action
          }

          $seenActive = @{}
          $active = @(
            $events |
              Where-Object { $_.Test -and $_.Action -eq "run" } |
              Sort-Object Time -Descending |
              Where-Object {
                if ($terminal.ContainsKey($_.Test) -or $seenActive.ContainsKey($_.Test)) {
                  return $false
                }
                $seenActive[$_.Test] = $true
                return $true
              }
          )

          $summary = [System.Collections.Generic.List[string]]::new()
          $summary.Add("## ${{ matrix.name }} Go test diagnostics")
          $summary.Add("")
          $summary.Add("### Tests active when the process ended")
          $summary.Add("")
          if ($active.Count -eq 0) {
            $summary.Add("None.")
          } else {
            foreach ($event in $active | Select-Object -First 25) {
              $summary.Add("- ``$($event.Test.Replace('|', '\|'))`` (started $($event.Time))")
            }
          }

          $summary.Add("")
          $summary.Add("### Slowest completed tests")
          $summary.Add("")
          $summary.Add("| Test | Result | Seconds |")
          $summary.Add("| --- | --- | ---: |")
          foreach ($event in $completed |
            Sort-Object { [double]$_.Elapsed } -Descending |
            Select-Object -First 25) {
            $name = $event.Test.Replace('|', '\|')
            $elapsed = "{0:N3}" -f [double]$event.Elapsed
            $summary.Add("| ``$name`` | $($event.Action) | $elapsed |")
          }

          $summary.Add("")
          $summary.Add("### Last completed tests")
          $summary.Add("")
          $summary.Add("| Completed | Test | Result | Seconds |")
          $summary.Add("| --- | --- | --- | ---: |")
          foreach ($event in $completed |
            Sort-Object Time -Descending |
            Select-Object -First 25) {
            $name = $event.Test.Replace('|', '\|')
            $elapsed = "{0:N3}" -f [double]$event.Elapsed
            $summary.Add("| $($event.Time) | ``$name`` | $($event.Action) | $elapsed |")
          }

          $summary | Write-Output
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload ${{ matrix.name }} test events
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: go-test-events-windows-${{ matrix.name }}-attempt-${{ github.run_attempt }}
          path: go-test-events.jsonl
          if-no-files-found: warn
          retention-days: 7

  # Keep the derived-mirror suite concurrent with the main Windows package set.
  test-duckdb-windows:
    name: Go Test (windows-latest, DuckDB)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare Windows Go paths
        uses: ./.github/actions/windows-go-paths

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go caches
        uses: ./.github/actions/go-cache-restore
        with:
          group: test-${{ runner.os }}-${{ runner.arch }}

      - name: Setup MinGW
        id: setup_mingw
        continue-on-error: true
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e  # v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc
          path-type: inherit

      - name: Setup MinGW (retry on transient failure)
        if: steps.setup_mingw.outcome == 'failure'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e  # v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc
          path-type: inherit

      - name: Restore pricing snapshot
        run: go run ./internal/pricing/cmd/litellm-snapshot -restore

      - name: Run DuckDB tests
        run: go test -tags "fts5" ./internal/duckdb -count=1 -timeout=20m
        env:
          CGO_ENABLED: "1"

  test-race:
    name: Go Test (race detector, ${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Sync A-R
            runner: ubuntu-latest
            package: ./internal/sync
            run: *sync-test-prefix
          - name: Sync remaining
            runner: ubuntu-latest
            package: ./internal/sync
            skip: *sync-test-prefix
          - name: CLI A-P
            runner: ubuntu-latest
            package: ./cmd/agentsview
            run: *cli-test-prefix
          - name: CLI remaining
            runner: ubuntu-latest
            package: ./cmd/agentsview
            skip: *cli-test-prefix
          - name: Database and Server
            runner: ubuntu-latest
            package: ./internal/db ./internal/server
          - name: Other packages
            runner: ubuntu-latest
            testSet: other
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go caches
        uses: ./.github/actions/go-cache-restore
        with:
          group: race-linux

      - name: Prepare SQLite header
        if: runner.os == 'Linux'
        run: |
          make sqlite-vec-header
          echo "CGO_CFLAGS=-O2 -g -I$GITHUB_WORKSPACE/.sqlite-include" >> "$GITHUB_ENV"

      - name: Restore pricing snapshot
        run: go run ./internal/pricing/cmd/litellm-snapshot -restore

      # Keep exclusions aligned with the explicit race matrix packages.
      # DuckDB runs without -race in its Linux shard. Limit package fan-out
      # because highly parallel race runs can exhaust deadlines.
      - name: Run Go tests (race detector)
        if: matrix.testSet == 'other'
        run: go list ./... | grep -vE '/(cmd/agentsview|internal/(db|server|duckdb|sync))$' | xargs go test -p 4 -tags "fts5" -race -count=1 -timeout=20m
        env:
          CGO_ENABLED: "1"

      - name: Run ${{ matrix.name }} tests (race detector)
        if: matrix.package != ''
        run: go test -tags "fts5" -race ${{ matrix.package }} -run '${{ matrix.run || '.' }}' -skip '${{ matrix.skip || '^$' }}' -count=1 -timeout=20m
        env:
          CGO_ENABLED: "1"

      # This job owns the shared cache, including tests run by the other shards.
      - name: Warm moved race test builds for the next run
        if: matrix.testSet == 'other' && github.event_name == 'push' && github.ref == 'refs/heads/main' && env.GO_CACHE_HIT != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/race-test-binaries"
          go test -p 4 -tags "fts5" -race -c -o "$RUNNER_TEMP/race-test-binaries/" ./cmd/agentsview ./internal/db ./internal/server
        env:
          CGO_ENABLED: "1"

      - name: Save Go caches
        if: matrix.testSet == 'other'
        uses: ./.github/actions/go-cache-save

  # Owns Windows Rust test coverage for PR and main-push desktop artifacts.
  desktop-windows-unit:
    name: Desktop Unit Tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2
        with:
          workspaces: desktop/src-tauri -> target
          # Pull requests restore main's build without saving their own copy.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Prepare placeholder sidecar resource
        shell: pwsh
        run: |
          $hostTriple = (rustc -vV | Select-String '^host: ').ToString() -replace '^host:\s+', ''
          if (-not $hostTriple) {
            throw "could not determine Rust host triple"
          }
          New-Item -ItemType Directory -Force desktop/src-tauri/binaries | Out-Null
          New-Item -ItemType File -Force "desktop/src-tauri/binaries/agentsview-$hostTriple.exe" | Out-Null

      - name: Fetch Windows desktop Rust dependencies
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            cargo fetch --locked --manifest-path desktop/src-tauri/Cargo.toml
            if ($LASTEXITCODE -eq 0) {
              break
            }
            if ($attempt -eq 3) {
              exit $LASTEXITCODE
            }
            Start-Sleep -Seconds (10 * $attempt)
          }

      - name: Run Windows desktop unit tests
        run: cargo test --locked --manifest-path desktop/src-tauri/Cargo.toml --lib

  integration:
    name: Integration (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: PostgreSQL core
            postgres-target: test-postgres-core-fast-ci
          - name: PostgreSQL raw-sync and ClickHouse
            postgres-target: test-postgres-raw-sync-ci test-postgres-core-heavy-ci
            clickhouse: true
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: agentsview_test
          POSTGRES_PASSWORD: agentsview_test_password
          POSTGRES_DB: agentsview_test
        ports:
          - 5433:5432
        # PG18 keeps its data under /var/lib/postgresql/18/docker. The suite
        # repeatedly rebuilds schemas; keep this disposable cluster in memory.
        options: >-
          --tmpfs /var/lib/postgresql:rw,size=4g
          --health-cmd "pg_isready -U agentsview_test -d agentsview_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
      clickhouse:
        # An empty image omits this service for the PostgreSQL-only lane.
        image: ${{ matrix.clickhouse && 'clickhouse/clickhouse-server:26.8' || '' }}
        env:
          CLICKHOUSE_SKIP_USER_SETUP: "1"
        ports:
          - 18123:8123
          - 19000:9000
        options: >-
          --tmpfs /var/lib/clickhouse
          --health-cmd "clickhouse-client --query 'SELECT 1'"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go caches
        uses: ./.github/actions/go-cache-restore
        with:
          group: test-${{ runner.os }}-${{ runner.arch }}

      - name: Restore pricing snapshot
        run: go run ./internal/pricing/cmd/litellm-snapshot -restore

      - name: Run PostgreSQL integration tests
        run: make ${{ matrix.postgres-target }}
        env:
          CGO_ENABLED: "1"
          TEST_PG_URL: postgres://agentsview_test:agentsview_test_password@localhost:5433/agentsview_test?sslmode=disable

      - name: Run ClickHouse integration tests
        if: matrix.clickhouse
        run: make test-clickhouse-ci
        env:
          CGO_ENABLED: "1"
          TEST_CLICKHOUSE_URL: clickhouse://localhost:19000/default

  e2e:
    name: e2e (${{ matrix.browser }})
    runs-on: ubuntu-latest
    env:
      PW_TEST_CONNECT_WS_ENDPOINT: ws://127.0.0.1:3000/
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go caches
        uses: ./.github/actions/go-cache-restore
        with:
          group: test-${{ runner.os }}-${{ runner.arch }}

      - name: Prepare SQLite header
        if: runner.os == 'Linux'
        run: |
          make sqlite-vec-header
          echo "CGO_CFLAGS=-O2 -g -I$GITHUB_WORKSPACE/.sqlite-include" >> "$GITHUB_ENV"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "24.22.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend
        env:
          VITE_PROJECT_MAPPING_WORKSPACE: "true"

      - name: Embed frontend in Go source tree
        run: |
          rm -rf internal/web/dist
          cp -r frontend/dist internal/web/dist

      - name: Restore pricing snapshot
        run: go run ./internal/pricing/cmd/litellm-snapshot -restore

      - name: Pre-build Go binaries
        run: |
          CGO_ENABLED=1 go build -tags fts5 \
            -o /tmp/testfixture ./cmd/testfixture
          CGO_ENABLED=1 go build -tags fts5 \
            -o /tmp/agentsview ./cmd/agentsview
        env:
          CGO_ENABLED: "1"

      - name: Start Playwright browser server
        id: browser_server
        timeout-minutes: 10
        run: |
          version=$(node -p 'require("./node_modules/@playwright/test/package.json").version')
          image="mcr.microsoft.com/playwright:v$version-noble"
          if ! docker pull "$image"; then
            echo "::error::Could not pull $image. Microsoft may not have published the image for this @playwright/test version yet."
            exit 1
          fi
          cid=$(docker run -d --name playwright-browser-server --init --ipc=host --network host \
            -v "$PWD:$PWD:ro" -w "$PWD" \
            "$image" \
            node node_modules/@playwright/test/cli.js run-server \
            --port 3000 --host 127.0.0.1 --unsafe)
          until curl -s http://127.0.0.1:3000/; do
            [ "$(docker inspect -f '{{.State.Running}}' "$cid")" = true ] || { docker logs "$cid"; exit 1; }
            sleep 1
          done
        working-directory: frontend

      - name: Run E2E tests
        run: npx playwright test --reporter=list --project=${{ matrix.browser }}
        working-directory: frontend
        env:
          E2E_PREBUILT_FIXTURE: /tmp/testfixture
          E2E_PREBUILT_SERVER: /tmp/agentsview
          PROJECT_MAPPING_WORKSPACE_E2E_ENABLED: "true"

      - name: Run DuckDB E2E tests
        if: matrix.browser == 'chromium'
        run: make e2e-duckdb
        env:
          E2E_PREBUILT_FIXTURE: /tmp/testfixture
          E2E_PREBUILT_SERVER: /tmp/agentsview
          PROJECT_MAPPING_WORKSPACE_E2E_ENABLED: "true"

      - name: Print Playwright browser server logs on failure
        if: failure() && steps.browser_server.outcome == 'success'
        run: docker logs playwright-browser-server
