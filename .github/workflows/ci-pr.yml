name: CI

# Run the workflow from this revision so its steps match the code under test.
on:
  pull_request:
  merge_group:
    types: [checks_requested]

permissions: read-all

jobs:
  run:
    cache-mode: read
    uses: ./.github/workflows/ci.yml

  gate:
    name: CI gate
    needs: run
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require successful CI
        if: needs.run.result != 'success'
        run: exit 1
