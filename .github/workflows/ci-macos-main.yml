name: CI (macOS)

env:
  API_VERSION_BASE: HEAD^1
  GOTRACEBACK: all
  # "|" falls back to direct on any proxy error (e.g. HTTP/2 INTERNAL_ERROR), not just 404/410.
  GOPROXY: "https://proxy.golang.org|direct"
  # Compile with module-relative source paths so identical source shares one
  # Go build cache across checkouts and worktrees.
  GOFLAGS: -trimpath

on:
  pull_request:
    paths:
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - '.custom-gcl.yml'
      - '.golangci.yml'
      - '.golangci.overlay.yml'
      - 'Makefile'
      - 'scripts/macos-watcher-tests.sh'
      - '.github/workflows/ci-macos-main.yml'
  push:
    branches: [main]
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'testdata/golden/**'
      - 'go.mod'
      - 'go.sum'
      - '.custom-gcl.yml'
      - '.golangci.yml'
      - '.golangci.overlay.yml'
      - 'Makefile'
      - 'scripts/macos-watcher-tests.sh'
      - '.github/workflows/ci-macos-main.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Timeout p99 measurements: https://github.com/kenn-io/agentsview/pull/2547
jobs:
  test-macos-fsevents:
    name: Go Test (macOS FSEvents)
    runs-on: macos-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go caches
        uses: $/.github/actions/go-cache-restore
        with:
          group: test-${{ runner.os }}-${{ runner.arch }}

      - uses: kenn-io/kit/.github/actions/kit-retry@v0.48.3

      - name: Restore pricing snapshot
        run: kit-retry 3 5 go run ./internal/pricing/cmd/litellm-snapshot -restore

      - name: Run focused macOS FSEvents deadline linters
        run: |
          kit-retry 3 5 make lint-tools nilaway-golangci-build
          ./custom-gcl run --enable-only kennlint,kennnolint,nolintlint ./internal/fsevents ./internal/sync
        env:
          CGO_ENABLED: "1"

      # Step timeouts end a hung test binary as a step failure, so the JSON
      # events reach the summary and upload steps below before the job limit.
      - name: Run focused macOS FSEvents tests
        if: github.event_name == 'push'
        timeout-minutes: 24
        run: CGO_ENABLED=1 go tool gotestsum --format pkgname-and-test-fails --format-icons text --jsonfile gotestsum/macos-fsevents.json --rerun-fails=2 --rerun-fails-report gotestsum/macos-fsevents-reruns.txt --packages "./internal/fsevents ./internal/sync ./internal/db ./cmd/agentsview" -- -tags "fts5" -count=1 -timeout=20m

      # Pull requests run only the watcher tests that scripts/macos-watcher-tests.sh
      # selects. The Linux Sync job runs the whole internal/sync package, and
      # pushes to main run it here on macOS.
      - name: Run focused macOS FSEvents tests for pull requests
        if: github.event_name == 'pull_request'
        timeout-minutes: 10
        run: |
          pattern=$(GOFLAGS="$GOFLAGS -tags=fts5" scripts/macos-watcher-tests.sh ./internal/fsevents ./internal/sync)
          go tool gotestsum --format pkgname-and-test-fails --format-icons text --jsonfile gotestsum/macos-fsevents.json --rerun-fails=2 --rerun-fails-report gotestsum/macos-fsevents-reruns.txt --packages "./internal/fsevents ./internal/sync" -- -tags "fts5" -run "$pattern" -count=1 -timeout=5m
        env:
          CGO_ENABLED: "1"

      # gotestsum prints a package's failures only after go test exits, and a
      # test binary stuck in exit never lets it. The JSON events were written
      # as they arrived, so list the tests that started without finishing and
      # print any test-timeout goroutine dump.
      - name: Show unfinished macOS FSEvents tests
        if: failure() && hashFiles('gotestsum/macos-fsevents.json') != ''
        run: |
          jq -r 'select(.Test and (.Action | IN("run", "pass", "fail", "skip"))) | [.Package, .Test, .Action] | @tsv' gotestsum/macos-fsevents.json |
            awk -F '\t' '{ key = $1 " " $2; open[key] += ($3 == "run") ? 1 : -1 } END { for (key in open) if (open[key] > 0) print "unfinished: " key }'
          jq -rj 'select(.Action == "output") | .Output' gotestsum/macos-fsevents.json |
            awk '/^panic: test timed out/ { dump = 1 } dump'

      # The push and pull request steps are exclusive, so they share one suite.
      - name: Upload gotestsum macos-fsevents results
        if: failure() || github.run_attempt > 1 || hashFiles('gotestsum/macos-fsevents-reruns.txt') != ''
        uses: actions/upload-artifact@v7.0.2
        with:
          name: gotestsum-macos-fsevents-attempt-${{ github.run_attempt }}
          path: gotestsum/macos-fsevents.json
          retention-days: 14
          if-no-files-found: ignore
