name: Fuzz

env:
  GOTRACEBACK: all
  # "|" falls back to direct on any proxy error (e.g. HTTP/2 INTERNAL_ERROR), not just 404/410.
  GOPROXY: "https://proxy.golang.org|direct"
  # Compile with module-relative source paths so identical source shares one
  # Go build cache across checkouts and worktrees.
  GOFLAGS: -trimpath

# Long-running fuzz exploration of the Antigravity wire-walk
# (GitHub #648). Every CI run already executes the committed seed
# corpus via plain `go test`; this workflow spends real fuzz time
# searching for new invariant violations on a schedule. A found
# failure is written to testdata/fuzz/ by the fuzz engine and
# uploaded as an artifact so it can be committed as a regression
# case.

on:
  schedule:
    - cron: "17 5 * * 1" # weekly, Monday 05:17 UTC
  workflow_dispatch:
    inputs:
      fuzztime:
        description: "Fuzz per target: positive Go duration up to 343m, or positive Nx iterations with a 360-minute job cap"
        required: false
        default: "10m"

# Timeout p99 measurements: https://github.com/kenn-io/agentsview/pull/2547
jobs:
  fuzz-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      timeout-minutes: ${{ steps.budget.outputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Calculate fuzz budget
        id: budget
        env:
          FUZZTIME: ${{ github.event.inputs.fuzztime || '10m' }}
        run: |
          cat > "$RUNNER_TEMP/fuzz-budget.go" <<'EOF'
          package main

          import (
              "fmt"
              "os"
              "strings"
              "time"
          )

          func main() {
              fuzztime := os.Getenv("FUZZTIME")
              minutes := int64(360)
              if !strings.HasSuffix(fuzztime, "x") {
                  duration, err := time.ParseDuration(fuzztime)
                  if err != nil || duration <= 0 || duration > 343*time.Minute {
                      fmt.Fprintln(os.Stderr, "fuzztime must be a positive Go duration of at most 343m or positive Nx iterations with a 360-minute job cap")
                      os.Exit(1)
                  }
                  // Keep the measured default's 17-minute allowance for setup, tests, and upload.
                  minutes = int64((duration+time.Minute-1)/time.Minute) + 17
              }
              output, err := os.OpenFile(os.Getenv("GITHUB_OUTPUT"), os.O_APPEND|os.O_WRONLY, 0)
              if err != nil {
                  fmt.Fprintln(os.Stderr, err)
                  os.Exit(1)
              }
              defer output.Close()
              if _, err := fmt.Fprintf(output, "timeout-minutes=%d\n", minutes); err != nil {
                  fmt.Fprintln(os.Stderr, err)
                  os.Exit(1)
              }
          }
          EOF
          go run "$RUNNER_TEMP/fuzz-budget.go"

  fuzz:
    needs: fuzz-budget
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(needs.fuzz-budget.outputs.timeout-minutes) }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - FuzzAgProtoParse
          - FuzzAgProtoLooksLikePrefix
          - FuzzDecodeAntigravityStep
          - FuzzExtractModelName
          - FuzzExtractTokenUsage
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go caches
        uses: $/.github/actions/go-cache-restore
        with:
          group: test-${{ runner.os }}-${{ runner.arch }}

      - name: Restore pricing snapshot
        run: go run ./internal/pricing/cmd/litellm-snapshot -restore

      # The dispatch input goes through an env var, never directly
      # into the run script, so it cannot inject shell commands.
      - name: Fuzz ${{ matrix.target }}
        run: >
          go test -tags "fts5"
          -fuzz "^${TARGET}$"
          -fuzztime "$FUZZTIME"
          ./internal/parser/
        env:
          CGO_ENABLED: "1"
          TARGET: ${{ matrix.target }}
          FUZZTIME: ${{ github.event.inputs.fuzztime || '10m' }}

      - name: Upload failing inputs
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: fuzz-failures-${{ matrix.target }}
          path: internal/parser/testdata/fuzz/
          if-no-files-found: ignore
