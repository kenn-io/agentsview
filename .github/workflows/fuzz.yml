name: Fuzz

env:
  GOTRACEBACK: all
  # "|" falls back to direct on any proxy error (e.g. HTTP/2 INTERNAL_ERROR), not just 404/410.
  GOPROXY: "https://proxy.golang.org|direct"
  # Compile with module-relative source paths so identical source shares one
  # Go build cache across checkouts and worktrees.
  GOFLAGS: -trimpath

# Scheduled fuzz exploration of every fuzz target in internal/parser:
# one FuzzProvider<Name> target per session provider, plus the
# Antigravity wire-walk targets (GitHub #648). Every CI run already
# replays the committed seed corpus through plain `go test`; this
# workflow spends real fuzz time searching for new invariant
# violations. Targets are found from the source, so a new target
# joins the schedule without editing this file, and they are spread
# over FUZZ_SHARDS parallel jobs that fuzz their share one after
# another. A found failure is written to testdata/fuzz/ by the fuzz
# engine and uploaded as an artifact so it can be committed as a
# regression case.

on:
  schedule:
    - cron: "17 5 * * 1" # weekly, Monday 05:17 UTC
  workflow_dispatch:
    inputs:
      fuzztime:
        description: "Fuzz per target: positive Go duration that fits each shard in 360 minutes, or positive Nx iterations with a 360-minute job cap"
        required: false
        default: "2m"

# Timeout p99 measurements: https://github.com/kenn-io/agentsview/pull/2547
jobs:
  fuzz-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      timeout-minutes: ${{ steps.budget.outputs.timeout-minutes }}
      targets: ${{ steps.budget.outputs.targets }}
      shards: ${{ steps.budget.outputs.shards }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Calculate fuzz budget
        id: budget
        env:
          FUZZTIME: ${{ github.event.inputs.fuzztime || '2m' }}
          FUZZ_SHARDS: "8"
        run: |
          targets=$(grep -ho '^func Fuzz[A-Za-z0-9_]*' internal/parser/*_test.go | cut -c6- | sort | tr '\n' ' ')
          export FUZZ_TARGETS="$targets"
          cat > "$RUNNER_TEMP/fuzz-budget.go" <<'GO'
          package main

          import (
              "fmt"
              "os"
              "strconv"
              "strings"
              "time"
          )

          // Setup, the seed replay, and the artifact upload take up to
          // 17 minutes per job, and each target adds about a minute to
          // instrument and replay its corpus.
          const (
              jobMinutes       = 360
              setupMinutes     = 17
              perTargetMinutes = 1
          )

          func main() {
              targets := strings.Fields(os.Getenv("FUZZ_TARGETS"))
              shards, err := strconv.Atoi(os.Getenv("FUZZ_SHARDS"))
              if err != nil || shards < 1 || len(targets) == 0 {
                  fail("need at least one fuzz target and one shard")
              }
              perShard := (len(targets) + shards - 1) / shards
              minutes := int64(jobMinutes)
              fuzztime := os.Getenv("FUZZTIME")
              if !strings.HasSuffix(fuzztime, "x") {
                  duration, err := time.ParseDuration(fuzztime)
                  if err != nil || duration <= 0 {
                      fail("fuzztime must be a positive Go duration or positive Nx iterations")
                  }
                  // Reject before rounding: adding to a duration near the
                  // int64 limit would overflow into a negative budget.
                  if duration > jobMinutes*time.Minute {
                      fail(fmt.Sprintf("fuzztime %s exceeds the %d-minute job cap", fuzztime, jobMinutes))
                  }
                  each := int64((duration+time.Minute-1)/time.Minute) + perTargetMinutes
                  minutes = int64(perShard)*each + setupMinutes
                  if minutes > jobMinutes {
                      fail(fmt.Sprintf("fuzztime %s for %d targets per shard needs %d minutes; the job cap is %d",
                          fuzztime, perShard, minutes, jobMinutes))
                  }
              }
              shardList := make([]string, shards)
              for i := range shardList {
                  shardList[i] = strconv.Itoa(i)
              }
              output, err := os.OpenFile(os.Getenv("GITHUB_OUTPUT"), os.O_APPEND|os.O_WRONLY, 0)
              if err != nil {
                  fail(err.Error())
              }
              defer output.Close()
              if _, err := fmt.Fprintf(output, "timeout-minutes=%d\ntargets=%s\nshards=[%s]\n",
                  minutes, strings.Join(targets, " "), strings.Join(shardList, ",")); err != nil {
                  fail(err.Error())
              }
          }

          func fail(msg string) {
              fmt.Fprintln(os.Stderr, msg)
              os.Exit(1)
          }
          GO
          go run "$RUNNER_TEMP/fuzz-budget.go"

  fuzz:
    needs: fuzz-budget
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(needs.fuzz-budget.outputs.timeout-minutes) }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.fuzz-budget.outputs.shards) }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go caches
        uses: $/.github/actions/go-cache-restore
        with:
          group: test-${{ runner.os }}-${{ runner.arch }}

      - uses: kenn-io/kit/.github/actions/kit-retry@v0.48.3

      - name: Restore pricing snapshot
        run: kit-retry 3 5 go run ./internal/pricing/cmd/litellm-snapshot -restore

      # The dispatch input goes through an env var, never directly
      # into the run script, so it cannot inject shell commands. A
      # failing target does not stop the shard: the rest still fuzz,
      # and the job fails at the end.
      - name: Fuzz shard ${{ matrix.shard }}
        run: |
          read -r -a targets <<< "$TARGETS"
          shards=$(jq length <<< "$SHARDS")
          status=0
          for i in "${!targets[@]}"; do
            (( i % shards == SHARD )) || continue
            target=${targets[$i]}
            echo "::group::$target"
            if ! go test -tags "fts5" -run "^${target}\$" -fuzz "^${target}\$" \
              -fuzztime "$FUZZTIME" ./internal/parser/; then
              echo "::error::$target found a failing input"
              status=1
            fi
            echo "::endgroup::"
          done
          exit "$status"
        env:
          CGO_ENABLED: "1"
          # Each input gets fresh temp files, and database targets build
          # a SQLite store per input. On tmpfs that costs about a
          # millisecond instead of a disk sync. Build files stay on disk.
          TMPDIR: /dev/shm
          GOTMPDIR: ${{ runner.temp }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ needs.fuzz-budget.outputs.shards }}
          TARGETS: ${{ needs.fuzz-budget.outputs.targets }}
          FUZZTIME: ${{ github.event.inputs.fuzztime || '2m' }}

      - name: Upload failing inputs
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: fuzz-failures-shard-${{ matrix.shard }}
          path: internal/parser/testdata/fuzz/
          if-no-files-found: ignore
