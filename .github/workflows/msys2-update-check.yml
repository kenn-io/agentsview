name: MSYS2 Update Check

env:
  GOTRACEBACK: all
  # "|" falls back to direct on any proxy error (e.g. HTTP/2 INTERNAL_ERROR), not just 404/410.
  GOPROXY: "https://proxy.golang.org|direct"
  # Compile with module-relative source paths so identical source shares one
  # Go build cache across checkouts and worktrees.
  GOFLAGS: -trimpath

# Periodically run Windows CI with MSYS2 updates enabled to catch
# toolchain drift, security fixes, and package metadata changes.
# If this workflow fails, update the pinned SHA and packages in ci.yml.

on:
  schedule:
    - cron: "0 9 * * 1"  # Every Monday at 09:00 UTC
  workflow_dispatch:

# Timeout p99 measurements: https://github.com/kenn-io/agentsview/pull/2547
jobs:
  windows-update-check:
    name: MSYS2 Update Check (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Other packages
            timeout: 27
            package: ./...
          # Keep CLI filters aligned with the CLI entries in ci.yml.
          - name: CLI A-P
            timeout: 27
            package: ./cmd/agentsview
            run: '^Test[A-P]'
          - name: CLI remaining
            timeout: 27
            package: ./cmd/agentsview
            skip: '^Test[A-P]'
          - name: Capture, Database, Parser
            timeout: 38
            package: ./internal/capture ./internal/db ./internal/parser
          - name: DuckDB
            timeout: 27
            package: ./internal/duckdb
          # Match normal Windows CI; complementary filters cover every sync test.
          - name: Sync A-R
            timeout: 27
            package: ./internal/sync
            run: '^Test[A-R]'
          - name: Sync remaining
            timeout: 27
            package: ./internal/sync
            skip: '^Test[A-R]'
    runs-on: windows-latest
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare Windows Go paths
        uses: $/.github/actions/windows-go-paths

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go caches
        uses: $/.github/actions/go-cache-restore
        with:
          group: test-${{ runner.os }}-${{ runner.arch }}

      - name: Restore pricing snapshot
        run: go run ./internal/pricing/cmd/litellm-snapshot -restore

      - name: Setup MinGW (with updates)
        uses: msys2/setup-msys2@v2.33.0
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc
          path-type: inherit

      - name: Stub frontend embed dir
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force internal/web/dist | Out-Null
          Set-Content -Path internal/web/dist/stub.html -Value ok

      # Capture tests reject the parent permissions of the SYSTEM temp path.
      # Keep their fixtures in a private directory on the system drive.
      - name: Prepare capture test temporary directory
        if: contains(matrix.package, './internal/capture')
        shell: pwsh
        run: |
          $testTemp = Join-Path $env:SystemDrive ("agentsview-ci-" + [guid]::NewGuid().ToString("N"))
          New-Item -ItemType Directory -Path $testTemp | Out-Null
          icacls $testTemp /inheritance:r /grant:r '*S-1-5-18:(OI)(CI)F' '*S-1-5-32-544:(OI)(CI)F'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "TMP=$testTemp" >> $env:GITHUB_ENV
          "TEMP=$testTemp" >> $env:GITHUB_ENV
          "AGENTSVIEW_CI_TEMP=$testTemp" >> $env:GITHUB_ENV

      - name: Run ${{ matrix.name }} tests
        shell: pwsh
        run: |
          $packages = '${{ matrix.package }}' -split ' '
          if ('${{ matrix.package }}' -eq './...') {
            # Keep isolated packages on separate runners, as in normal CI.
            $packages = @(go list ./...)
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $isolatedPackages = @(
              'go.kenn.io/agentsview/cmd/agentsview'
              'go.kenn.io/agentsview/internal/capture'
              'go.kenn.io/agentsview/internal/db'
              'go.kenn.io/agentsview/internal/duckdb'
              'go.kenn.io/agentsview/internal/parser'
              'go.kenn.io/agentsview/internal/sync'
            )
            $packages = $packages | Where-Object { $_ -notin $isolatedPackages }
          }
          go test -tags "fts5" $packages -run '${{ matrix.run || '.' }}' -skip '${{ matrix.skip || '^$' }}' -v -count=1 -timeout=20m
        env:
          CGO_ENABLED: "1"

      - name: Remove capture test temporary directory
        if: always() && contains(matrix.package, './internal/capture') && env.AGENTSVIEW_CI_TEMP != ''
        shell: pwsh
        run: Remove-Item -LiteralPath $env:AGENTSVIEW_CI_TEMP -Recurse -Force
