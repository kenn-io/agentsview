name: Restore Go caches
description: >-
  Restore the newest main-saved Go build and module caches for one job group.
  Pair with go-cache-save in the job that owns the group.
inputs:
  owner:
    description: Track entries used by the job that saves this group
    required: false
    default: "false"
  group:
    description: Cache group, such as linux-cgo or windows-amd64
    required: true
  extra-path:
    description: Additional cache directory owned by the group
    required: false
    default: ""
  include-go-cache:
    description: Include Go build and module caches
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - name: Select cache key and paths
      shell: bash
      env:
        GROUP: ${{ inputs.group }}
        EXTRA_PATH: ${{ inputs.extra-path }}
        INCLUDE_GO_CACHE: ${{ inputs.include-go-cache }}
        GO_SUM: ${{ hashFiles('go.sum') }}
      run: |
        # One key per group and day: main refreshes it daily instead of freezing on go.sum.
        {
          echo "GO_CACHE_KEY=go-${GROUP}-${GO_SUM}-$(date -u +%Y-%m-%d)"
          echo "GO_CACHE_PREFIX=go-${GROUP}-${GO_SUM}-"
          echo "GO_CACHE_GROUP_PREFIX=go-${GROUP}-"
          echo "GO_CACHE_PATHS<<EOF"
          if [ "$INCLUDE_GO_CACHE" = 'true' ]; then
            go env GOCACHE
            go env GOMODCACHE
          fi
          if [ -n "$EXTRA_PATH" ]; then echo "$EXTRA_PATH"; fi
          echo "EOF"
        } >> "$GITHUB_ENV"

    - name: Select measurement generation
      if: github.event_name == 'pull_request'
      shell: bash
      env:
        GROUP: ${{ inputs.group }}
        OWNER: ${{ inputs.owner }}
        CACHE_ACTION_PATH: ${{ github.action_path }}
      run: node "$CACHE_ACTION_PATH/../../measure-go-cache/select.cjs"

    - name: Restore caches
      id: restore
      uses: actions/cache/restore@v6.1.0
      with:
        path: ${{ env.GO_CACHE_PATHS }}
        key: ${{ env.GO_CACHE_KEY }}
        fail-on-cache-miss: ${{ env.MEASURE_GO_CACHE == 'true' }}
        restore-keys: |
          ${{ env.GO_CACHE_PREFIX }}
          ${{ env.GO_CACHE_GROUP_PREFIX }}

    - name: Record exact cache hit
      shell: bash
      env:
        MATCHED_KEY: ${{ steps.restore.outputs.cache-matched-key }}
        HIT: ${{ steps.restore.outputs.cache-hit }}
      run: |
        if [ "$MEASURE_GO_CACHE" = true ]; then
          test "$HIT" = true
          printf 'measure-go-cache matched=%s generation=%s save=%s\n' "$MATCHED_KEY" "$MEASURE_GO_CACHE_GENERATION" "$MEASURE_GO_CACHE_SAVE"
        fi
        echo "GO_CACHE_HIT=$HIT" >> "$GITHUB_ENV"

    - name: Track cache use
      if: >-
        inputs.owner == 'true' && ((github.event_name == 'push'
        && github.ref == 'refs/heads/main' && steps.restore.outputs.cache-hit != 'true')
        || (github.event_name == 'pull_request' && env.MEASURE_GO_CACHE_TRACK == 'true'))
      shell: bash
      env:
        CACHE_ACTION_PATH: ${{ github.action_path }}
      run: |
        # Go refreshes cache mtimes at most once an hour, so force used entries to refresh.
        if [ "$RUNNER_OS" = 'macOS' ]; then
          aged="$(date -v-2H +%Y%m%d%H%M.%S)"
        else
          aged="$(date -d '2 hours ago' +%Y%m%d%H%M.%S)"
        fi
        source "$CACHE_ACTION_PATH/select-paths.sh"
        for path in "${paths[@]}"; do
          find "$path" -mindepth 2 -maxdepth 2 \( -type f -o -type d \) \( -name '*-a' -o -name '*-d' \) -exec touch -t "$aged" {} +
        done
        marker="$(mktemp "$RUNNER_TEMP/go-cache-tracking.XXXXXX")"
        echo "GO_CACHE_TRACKING=$marker" >> "$GITHUB_ENV"
