name: Build desktop artifact
description: Build, smoke-test, and upload one desktop bundle

inputs:
  bundle:
    description: Tauri bundle type
    required: true
  target_triple:
    description: Optional Rust target triple
    required: true
  artifact_name:
    description: Uploaded artifact name
    required: true
  artifact_dir:
    description: Bundle output directory
    required: true
  frontend_prebuilt:
    description: Use frontend assets supplied by the caller
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - name: Prepare Windows Go paths
      uses: ./.github/actions/windows-go-paths

    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
      with:
        go-version-file: go.mod
        cache: false

    - name: Restore Go caches
      uses: ./.github/actions/go-cache-restore
      with:
        group: test-${{ runner.os }}-${{ runner.arch }}

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
      with:
        node-version: "24.22.1"
        cache: npm
        cache-dependency-path: |
          desktop/package-lock.json
          frontend/package-lock.json

    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable
      id: rust-toolchain
      continue-on-error: true

    - name: Wait before retrying Rust setup
      if: steps.rust-toolchain.outcome == 'failure'
      shell: bash
      run: sleep 10

    - name: Retry Rust setup
      if: steps.rust-toolchain.outcome == 'failure'
      uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2
      with:
        workspaces: desktop/src-tauri -> target
        # Pull requests restore main's build without saving their own copy.
        save-if: ${{ github.ref == 'refs/heads/main' }}

    - name: Setup MinGW (Windows)
      if: runner.os == 'Windows'
      uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e  # v2
      with:
        msystem: MINGW64
        update: false
        install: mingw-w64-x86_64-gcc
        path-type: inherit

    - name: Install Linux system dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update -q
        sudo apt-get install -y \
          libwebkit2gtk-4.1-dev libgtk-3-dev \
          libappindicator3-dev librsvg2-dev \
          patchelf squashfs-tools xdg-utils

    - name: Install Rust target
      shell: bash
      env:
        AGENTSVIEW_TARGET_TRIPLE: ${{ inputs.target_triple }}
      run: |
        if [ -n "$AGENTSVIEW_TARGET_TRIPLE" ]; then
          rustup target add "$AGENTSVIEW_TARGET_TRIPLE"
        fi

    - name: Install desktop dependencies
      shell: bash
      run: npm ci
      working-directory: desktop

    - name: Desktop sidecar smoke tests
      shell: bash
      run: bash desktop/scripts/test-prepare-sidecar.sh

    - name: Build desktop bundle
      shell: bash
      env:
        AGENTSVIEW_FRONTEND_PREBUILT: ${{ inputs.frontend_prebuilt }}
        AGENTSVIEW_TARGET_TRIPLE: ${{ inputs.target_triple }}
        ARTIFACT_DIR: ${{ inputs.artifact_dir }}
        BUNDLE: ${{ inputs.bundle }}
      run: |
        cd desktop
        export TAURI_ENV_TARGET_TRIPLE="$AGENTSVIEW_TARGET_TRIPLE"
        npm run prepare-sidecar
        build_cmd=(npx tauri build --verbose --bundles "$BUNDLE")
        if [ -n "$AGENTSVIEW_TARGET_TRIPLE" ]; then
          build_cmd+=(--target "$AGENTSVIEW_TARGET_TRIPLE")
        fi
        build_cmd+=(--config '{"bundle":{"createUpdaterArtifacts":false}}')

        if ! "${build_cmd[@]}"; then
          echo "::warning::Desktop bundle failed; retrying once"
          sleep 10
          "${build_cmd[@]}"
        fi
        if [ "$BUNDLE" = "appimage" ]; then
          bash scripts/repair-appimage-diricon.sh \
            "../${ARTIFACT_DIR}"/*.AppImage
        fi

    - name: Desktop smoke tests (Rust unit tests)
      # CI's desktop-windows-unit covers Windows on pull_request and push.
      if: runner.os != 'Windows' || (github.event_name != 'pull_request' && github.event_name != 'push')
      shell: bash
      env:
        AGENTSVIEW_TARGET_TRIPLE: ${{ inputs.target_triple }}
      run: |
        test_cmd=(cargo test --manifest-path desktop/src-tauri/Cargo.toml --lib)
        if [ -n "$AGENTSVIEW_TARGET_TRIPLE" ]; then
          export TAURI_ENV_TARGET_TRIPLE="$AGENTSVIEW_TARGET_TRIPLE"
          test_cmd+=(--target "$AGENTSVIEW_TARGET_TRIPLE")
        fi
        "${test_cmd[@]}"

    - name: Smoke check sidecar metadata
      shell: bash
      env:
        AGENTSVIEW_TARGET_TRIPLE: ${{ inputs.target_triple }}
      run: |
        target_triple="${AGENTSVIEW_TARGET_TRIPLE:-$(rustc -vV | awk '/^host: /{print $2}')}"
        if [ -z "$target_triple" ]; then
          echo "target triple is empty" >&2
          exit 1
        fi

        ext=""
        if [[ "$target_triple" == *"windows"* ]]; then
          ext=".exe"
        fi
        sidecar="desktop/src-tauri/binaries/agentsview-${target_triple}${ext}"
        if [ ! -f "$sidecar" ]; then
          echo "missing sidecar binary: $sidecar" >&2
          exit 1
        fi

        "$sidecar" version > sidecar-version.txt
        if grep -q "agentsview dev" sidecar-version.txt; then
          echo "sidecar version should not be dev: $(cat sidecar-version.txt)" >&2
          exit 1
        fi
        if grep -q "commit unknown" sidecar-version.txt; then
          echo "sidecar metadata missing commit: $(cat sidecar-version.txt)" >&2
          exit 1
        fi
        if grep -Eq "built[[:space:]]*\)$" sidecar-version.txt; then
          echo "sidecar metadata missing build date: $(cat sidecar-version.txt)" >&2
          exit 1
        fi

    # The test job covers Linux x64, Windows x64 and macOS ARM64; desktop builds
    # own the caches of the platforms it does not run on.
    - name: Save Go caches
      if: >-
        (runner.os == 'Linux' && runner.arch == 'ARM64')
        || (runner.os == 'macOS' && runner.arch == 'X64')
      uses: ./.github/actions/go-cache-save

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
      with:
        name: ${{ inputs.artifact_name }}
        path: ${{ inputs.artifact_dir }}
        if-no-files-found: error
