name: Save Go caches
description: >-
  Save the group's Go caches from a main push. Pull requests only restore, so
  their runs cannot evict main's caches from the repository's cache quota.
runs:
  using: composite
  steps:
    - name: Prune unused cache entries
      if: (env.GO_CACHE_HIT != 'true' || env.MEASURE_GO_CACHE_TRACK == 'true') && env.GO_CACHE_TRACKING != ''
      shell: bash
      env:
        CACHE_ACTION_PATH: ${{ github.action_path }}
      run: |
        source "$CACHE_ACTION_PATH/../go-cache-restore/select-paths.sh"
        if [ "${#paths[@]}" -eq 0 ]; then exit 0; fi
        keep="$(mktemp "$RUNNER_TEMP/go-cache-keep.XXXXXX")"
        # Validate every fresh record before deleting anything, including in other paths.
        find "${paths[@]}" -mindepth 2 -maxdepth 2 -type f -name '*-a' -newer "$GO_CACHE_TRACKING" -exec cat {} + |
          awk '$1 != "v1" || length($3) != 64 || $3 ~ /[^0-9a-f]/ { bad=1 } { print $3 "-d" } END { exit bad }' > "$keep"
        find "${paths[@]}" -mindepth 2 -maxdepth 2 \( -type f -o -type d \) \( -name '*-a' -o -name '*-d' \) ! -newer "$GO_CACHE_TRACKING" -print |
          awk 'FILENAME == ARGV[1] { keep[$0]=1; next } { n=split($0, parts, "/"); if (!(parts[n] in keep)) printf "%s%c", $0, 0 }' "$keep" - |
          xargs -0 rm -rf --
        du -sk "${paths[@]}"
        modules="$(go env GOMODCACHE)"
        if [ "$RUNNER_OS" = 'Windows' ]; then modules="$(cygpath -u "$modules")"; fi
        if [ -d "$modules" ]; then du -sk "$modules"; fi

    - name: Save caches
      if: >-
        (github.event_name == 'push' && github.ref == 'refs/heads/main'
        && env.GO_CACHE_HIT != 'true')
        || (github.event_name == 'pull_request' && env.MEASURE_GO_CACHE_SAVE == 'true')
      uses: actions/cache/save@v6.1.0
      with:
        path: ${{ env.GO_CACHE_PATHS }}
        key: ${{ env.MEASURE_GO_CACHE_SAVE_KEY || env.GO_CACHE_KEY }}
