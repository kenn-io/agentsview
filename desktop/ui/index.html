<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>// Copied from kenn-io/actions first-paint/hold-first-paint.js. The server CSP
// allows it by hash; update holdFirstPaintScriptHash when this file changes.
// Keeps the page hidden until its stylesheets and fonts are ready, so text
// never paints in a fallback face. Chromium decodes even a font embedded in
// the stylesheet only after its first paint, so embedding alone is not enough.
// Inline this script in <head> before any stylesheet.
(() => {
  const root = document.documentElement;
  // Opacity hides every descendant. A descendant can override visibility.
  // The important priority keeps a stylesheet's opacity rule from showing the
  // page early.
  const opacity = root.style.getPropertyValue("opacity");
  const priority = root.style.getPropertyPriority("opacity");
  root.style.setProperty("opacity", "0", "important");
  let shown = false;
  const show = () => {
    if (shown) return;
    shown = true;
    root.style.setProperty("opacity", opacity, priority);
  };
  // Never hide the page longer than a browser blocks text on a slow font.
  setTimeout(show, 3000);
  const ready = async () => {
    const pending = [...document.querySelectorAll("link")]
      .filter((link) => {
        const rel = link.rel.toLowerCase().split(/\s+/);
        return rel.includes("stylesheet") && !rel.includes("alternate");
      })
      // A disabled or print stylesheet does not style the screen.
      .filter((link) => !link.disabled && matchMedia(link.media || "all").matches && !link.sheet)
      .map((link) => new Promise((done) => {
        link.addEventListener("load", done);
        link.addEventListener("error", done);
      }));
    await Promise.all(pending);
    // Load every declared face, including ones only text rendered later by
    // JavaScript uses. A failed face falls back the way it would anyway.
    await Promise.all([...document.fonts].map((face) => face.load().catch(() => {})));
    show();
  };
  // The head is parsed, and every stylesheet link is in the document, once
  // the document leaves "loading". Deferred and module scripts run later.
  if (document.readyState === "loading") {
    document.addEventListener("readystatechange", ready, { once: true });
  } else {
    ready();
  }
})();
</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgentsView</title>
    <style>
      :root {
        color-scheme: light;
        --bg-1: #f6fbff;
        --bg-2: #e8f2ff;
        --ink-1: #0c1f35;
        --ink-2: #3c5575;
        --panel-border: #cadef7;
        --brand: #2f7cf6;
        --brand-deep: #1355bf;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: "Avenir Next", "Segoe UI Variable", "SF Pro Display", "Segoe UI", sans-serif;
        color: var(--ink-1);
        background:
          radial-gradient(1200px 640px at 8% -5%, #dcecff 0%, transparent 62%),
          radial-gradient(940px 560px at 100% 110%, #eaf3ff 0%, transparent 58%),
          linear-gradient(160deg, var(--bg-1), var(--bg-2));
      }

      .shell {
        width: min(680px, 100%);
        border-radius: 20px;
        border: 1px solid var(--panel-border);
        background: rgba(255, 255, 255, 0.92);
        backdrop-filter: blur(6px);
        box-shadow:
          0 20px 60px rgba(29, 64, 122, 0.18),
          0 2px 0 rgba(255, 255, 255, 0.75) inset;
        overflow: hidden;
      }

      .top-glow {
        height: 4px;
        background: linear-gradient(90deg, #81b8ff, #2f7cf6, #81b8ff);
        background-size: 220% 100%;
        animation: sweep 2.4s linear infinite;
      }

      .content {
        padding: 26px 28px 24px;
      }

      .brand-row {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .brand-mark {
        width: 34px;
        height: 34px;
        flex-shrink: 0;
      }

      .brand-name {
        margin: 0;
        font-size: 1rem;
        letter-spacing: 0.015em;
        color: #1c3d66;
        font-weight: 650;
      }

      h1 {
        margin: 14px 0 8px;
        font-size: clamp(1.4rem, 2.2vw, 1.75rem);
        line-height: 1.15;
        letter-spacing: -0.015em;
      }

      #status {
        margin: 0;
        color: var(--ink-2);
        line-height: 1.45;
        font-size: 0.98rem;
      }

      .meter {
        position: relative;
        margin-top: 18px;
        height: 8px;
        border-radius: 999px;
        background: #dbe9fb;
        overflow: hidden;
      }

      .meter::before {
        content: "";
        position: absolute;
        inset: 0;
        width: 42%;
        border-radius: inherit;
        background: linear-gradient(90deg, #52a2ff, #2f7cf6 45%, #1054bf);
        animation: loading 1.5s ease-in-out infinite;
      }

      .stage-list {
        margin: 18px 0 0;
        padding: 0;
        list-style: none;
        display: grid;
        gap: 8px;
      }

      .stage {
        display: flex;
        align-items: center;
        gap: 10px;
        color: #49678e;
        font-size: 0.88rem;
      }

      .stage-dot {
        width: 7px;
        height: 7px;
        border-radius: 999px;
        flex-shrink: 0;
      }

      .stage[data-state="pending"] {
        color: #8fa6c5;
      }

      .stage[data-state="pending"] .stage-dot {
        background: #bccfe6;
      }

      .stage[data-state="active"] .stage-dot {
        background: var(--brand);
        box-shadow: 0 0 0 0 rgba(47, 124, 246, 0.35);
        animation: pulse 1.8s ease-in-out infinite;
      }

      .stage[data-state="completed"] {
        color: #2a6d3e;
      }

      .stage[data-state="completed"] .stage-dot {
        width: 14px;
        height: 14px;
        margin: -3.5px -3.5px;
        background: #2a9d51;
      }

      .stage-check {
        display: none;
        width: 8px;
        height: 8px;
      }

      .stage[data-state="completed"] .stage-check {
        display: block;
        position: absolute;
      }

      .stage-dot-wrap {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .foot {
        margin-top: 18px;
        padding-top: 12px;
        border-top: 1px solid #deebfb;
        color: #5f7fa8;
        font-size: 0.78rem;
        letter-spacing: 0.02em;
      }

      @keyframes loading {
        0% {
          transform: translateX(-35%);
          width: 32%;
        }
        55% {
          width: 56%;
        }
        100% {
          transform: translateX(240%);
          width: 38%;
        }
      }

      @keyframes pulse {
        0%,
        100% {
          box-shadow: 0 0 0 0 rgba(47, 124, 246, 0.25);
          opacity: 0.9;
        }
        50% {
          box-shadow: 0 0 0 8px rgba(47, 124, 246, 0);
          opacity: 1;
        }
      }

      @keyframes sweep {
        from {
          background-position: 0% 50%;
        }
        to {
          background-position: 220% 50%;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .top-glow,
        .meter::before,
        .stage-dot {
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell" role="status" aria-live="polite">
      <div class="top-glow"></div>
      <div class="content">
        <div class="brand-row">
          <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
            <rect width="32" height="32" rx="6" fill="var(--brand)" />
            <rect x="13" y="10" width="6" height="16" rx="2" fill="#fff" />
            <rect x="11" y="5" width="10" height="7" rx="2" fill="#fff" />
            <circle cx="18" cy="8.5" r="2" fill="var(--brand)" />
            <circle cx="18" cy="8.5" r="1" fill="var(--brand-deep)" />
          </svg>
          <p class="brand-name">AgentsView Desktop</p>
        </div>

        <h1>Preparing your workspace</h1>
        <p id="status">Starting local backend and loading the interface.</p>

        <div class="meter" aria-hidden="true"></div>

        <ul class="stage-list" aria-hidden="true">
          <li class="stage" data-state="active">
            <span class="stage-dot-wrap">
              <span class="stage-dot"></span>
              <svg class="stage-check" viewBox="0 0 8 8" fill="none">
                <path d="M1.5 4L3.2 5.8L6.5 2.2" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
            Launching local service
          </li>
          <li class="stage" data-state="pending">
            <span class="stage-dot-wrap">
              <span class="stage-dot"></span>
              <svg class="stage-check" viewBox="0 0 8 8" fill="none">
                <path d="M1.5 4L3.2 5.8L6.5 2.2" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
            Connecting to session database
          </li>
          <li class="stage" data-state="pending">
            <span class="stage-dot-wrap">
              <span class="stage-dot"></span>
              <svg class="stage-check" viewBox="0 0 8 8" fill="none">
                <path d="M1.5 4L3.2 5.8L6.5 2.2" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
            Opening app shell
          </li>
        </ul>

        <div class="foot">Everything stays local to this machine.</div>
      </div>
    </main>
    <script>
      window.__setStage = function(activeIndex) {
        var stages = document.querySelectorAll('.stage');
        for (var i = 0; i < stages.length; i++) {
          if (i < activeIndex) {
            stages[i].setAttribute('data-state', 'completed');
          } else if (i === activeIndex) {
            stages[i].setAttribute('data-state', 'active');
          } else {
            stages[i].setAttribute('data-state', 'pending');
          }
        }
      };
      window.__setStatus = function(text) {
        document.getElementById('status').textContent = text;
      };
    </script>
  </body>
</html>
