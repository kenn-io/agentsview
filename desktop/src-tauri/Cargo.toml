[package]
name = "agentsview-desktop"
version = "0.1.0"
description = "AgentsView desktop wrapper"
authors = ["Kenn Software LLC"]
edition = "2021"

[lib]
name = "agentsview_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# build.rs checks the updater public key with src/updater_key.rs.
base64 = "0.23"
minisign-verify = "0.3"
serde_json = "1"

[dependencies]
tauri = { version = "2.12.5", features = [] }
serde = { version = "1", features = ["derive"] }
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2.14.1"
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
tokio = { version = "1", features = ["time", "sync"] }

[dev-dependencies]
base64 = "0.23"
minisign-verify = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "2.12.5", features = ["image-png", "tray-icon"] }

[target.'cfg(target_os = "windows")'.dependencies]
tauri = { version = "2.12.5", features = ["tray-icon"] }
# tauri-plugin-updater builds zip without Deflate support, but the release
# pipeline Deflate-compresses the .nsis.zip update archive. These features let
# the updater unpack it. flate2 selects the pure-Rust backend Deflate needs.
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
