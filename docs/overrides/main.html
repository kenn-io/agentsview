{% extends "base.html" %}

{% block extrahead %}
  {{ super() }}
  <meta property="og:image" content="https://agentsview.io/docs/assets/static/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="AgentsView">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://agentsview.io/docs/assets/static/og-image.png">
  {% if page and page.canonical_url %}
    {% if page.canonical_url == config.site_url %}
      <link rel="alternate" type="text/markdown" href="{{ page.canonical_url }}index.md">
    {% elif page.canonical_url[-1:] == "/" %}
      <link rel="alternate" type="text/markdown" href="{{ page.canonical_url[:-1] }}.md">
    {% endif %}
  {% endif %}
{% endblock %}
