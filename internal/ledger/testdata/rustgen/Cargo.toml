[package]
name = "ledger-fixture-gen"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]
resolver = "2"

[workspace.package]
version = "0.8.1"
edition = "2021"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v7", "serde"] }
thiserror = "2"
crc32fast = "1"
tracing = "0.1"
libc = "0.2"

[dependencies]
ledger-core = { path = "jilog/crates/ledger-core" }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v5", "v7", "serde"] }
