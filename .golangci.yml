# Generated by kennlint config from go.kenn.io/kit/lint/config.
# Put repository-specific additions in the overlay file; do not edit this file by hand.
version: "2"
run:
  tests: true
  timeout: 10m
  allow-parallel-runners: true
  go: "1.27"
  build-tags:
    - fts5
linters:
  default: none
  enable:
    # Correctness
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - errorlint
    - errchkjson
    - nilerr
    - nilnesserr
    - bodyclose
    - noctx
    - durationcheck
    - exhaustive
    - gocritic
    - makezero
    - reassign
    - copyloopvar
    # Modern and idiomatic Go
    - modernize
    - intrange
    - usestdlibvars
    - perfsprint
    - unconvert
    - wastedassign
    - predeclared
    - errname
    - iface
    - recvcheck
    - mirror
    - exptostd
    # Tests
    - testifylint
    - usetesting
    - thelper
    - tparallel
    - testableexamples
    # Policy
    - forbidigo
    - importas
    - nolintlint
    - misspell
    - gocheckcompilerdirectives
    # kit analyzers (requires a custom golangci-lint build, see docs)
    - kennlint
  settings:
    errcheck:
      check-type-assertions: false
      check-blank: false
    testifylint:
      enable-all: true
      disable:
        # Identifier names do not prove that an assertion compares encoded data.
        - encoded-compare
    exhaustive:
      default-signifies-exhaustive: true
    usetesting:
      os-temp-dir: true
      context-background: true
      context-todo: true
    gocritic:
      # Only the bug-finding checks; style and opinionated tags are noise.
      enabled-tags:
        - diagnostic
      disabled-tags:
        - style
        - performance
        - experimental
        - opinionated
      disabled-checks:
        - filepathJoin
    misspell:
      ignore-rules:
        - importas
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false
    importas:
      no-unaliased: true
      alias:
        - pkg: github.com/stretchr/testify/assert
          alias: ""
        - pkg: github.com/stretchr/testify/require
          alias: ""
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: '^t\.(Fatal|Fatalf|Error|Errorf|Fail|FailNow)$'
          msg: Use testify assert/require helpers in tests.
        - pattern: '^testing\..+\.(Fatal|Fatalf|Error|Errorf|Fail|FailNow)$'
          msg: Use testify assert/require helpers in tests.
        - pattern: '^exec\.Command$'
          msg: Use exec.CommandContext so subprocesses honor cancellation.
        - pattern: '^http\.(Get|Post|Head|PostForm)$'
          msg: Build the request with http.NewRequestWithContext and a client with timeouts.
        - pattern: '^http\.DefaultClient$'
          msg: Construct an http.Client with explicit timeouts.
        - pattern: '^time\.Local$'
          msg: Keep stored and transported times in UTC; convert for display only.
        - pattern: '^os\.Chdir$'
          msg: Pass explicit paths or use cmd.Dir; the process working directory is shared state.
        - pattern: '^errors\.As$'
          msg: Use errors.AsType[E] for typed error extraction.
        - pattern: '^ioutil\..*$'
          msg: io/ioutil is deprecated; use io and os.
    custom:
      kennlint:
        type: module
        description: kit analyzers for test discipline, error identity, and route registration.
        original-url: go.kenn.io/kit/lint
        settings:
          errtext:
            include-tests: false
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Tests may drop errors from cleanup and helper calls.
      - linters:
          - errcheck
        path: _test\.go
      # Test files start subprocesses and requests against local fixtures.
      - linters:
          - forbidigo
        path: _test\.go
        text: (exec\.Command|http\.(Get|Post|Head|PostForm)|http\.DefaultClient)
      # A main package owns process exit and may work without a caller context.
      - linters:
          - forbidigo
        path: ^(cmd/|main\.go)
        text: exec\.Command
      - linters:
          - modernize
        text: "omitzero:"
    paths:
      - third_party$
      - builtin$
      - examples$
      - testdata$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
    - gofumpt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
      - testdata$
