# Docker Compose file for integration testing
# Usage:
#   make postgres-up / make test-postgres / make postgres-down
#   make clickhouse-up / make test-clickhouse / make clickhouse-down

services:
  postgres:
    image: pgvector/pgvector:pg16
    # Lock memory sizes how many tests run at once; 256 allows 12
    # (see docs/agents/storage.md).
    command: postgres -c max_locks_per_transaction=256
    environment:
      POSTGRES_USER: agentsview_test
      POSTGRES_PASSWORD: agentsview_test_password
      POSTGRES_DB: agentsview_test
    ports:
      - "${TEST_PG_PUBLISH:-5433:5432}"  # Non-standard port to avoid conflict with local postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U agentsview_test -d agentsview_test"]
      interval: 2s
      timeout: 5s
      retries: 10
    tmpfs:
      - /var/lib/postgresql/data  # Use tmpfs for faster tests, no persistence needed

  clickhouse:
    image: clickhouse/clickhouse-server:26.8
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    ports:
      - "${TEST_CH_HTTP_PUBLISH:-18123:8123}"
      - "${TEST_CH_NATIVE_PUBLISH:-19000:9000}"
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1'"]
      interval: 2s
      timeout: 5s
      retries: 15
    tmpfs:
      - /var/lib/clickhouse
